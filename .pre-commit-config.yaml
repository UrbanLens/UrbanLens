# See https://pre-commit.com for more information
default_language_version:
    python: python3.12

default_install_hook_types: [pre-commit, pre-push]
files: '^(.+\.(py|ts|js|tsx|jsx|yaml|toml|html|txt))$'
exclude: '(^[._]|/config/|/docs/|/downloads/|/logs/|/pgsql/|/node_modules/)'

# GITHUB
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: debug-statements

# RUFF
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        always_run: true
        pass_filenames: false

# REPOSITORY CONSISTENCY
-   repo: local
    hooks:
      - id: imports-tracked
        name: every urbanlens.* import resolves to a committed file
        entry: python3 bin/check_imports_tracked.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: outage-not-cached
        name: no fetch caches a swallowed failure as a result
        entry: python3 bin/check_outage_not_cached.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: notification-choke-point
        name: every notification write honours the mute preference
        entry: python3 bin/check_notification_choke_point.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: versioned-writes
        name: a model that versions fields records every write path
        entry: python3 bin/check_versioned_writes.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: signal-reachable
        name: no post_save subscription waits on a field only update() sets
        entry: python3 bin/check_signal_reachable.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: concealed-writes
        name: a wiki resolved for reading is never saved
        entry: python3 bin/check_concealed_writes.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: template-comments
        name: "Django {# comments close on the line they open"
        entry: python3 bin/check_template_comments.py
        language: system
        files: '\.(html|txt)$'
        pass_filenames: false

# CODEQL
# Full analysis is minutes, so this is a pre-push hook rather than per-commit.
# `--gate` matches the suites GitHub runs on a PR; a no-op when the tree has
# not changed since the last clean scan. Missing CLI is a skip, not a block -
# CI still runs CodeQL. Install with: python bin/run_codeql.py --install
-   repo: local
    hooks:
      - id: codeql
        name: CodeQL analysis (pre-push)
        entry: python3 bin/run_codeql.py --gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

# TYPESCRIPT
-   repo: local
    hooks:
      - id: tsc
        name: tsc (typescript typecheck)
        entry: bun run typecheck
        language: system
        files: '\.tsx?$'
        pass_filenames: false
      - id: bun-test
        name: bun test (typescript unit tests)
        entry: bun run test:ts
        language: system
        files: '\.tsx?$'
        pass_filenames: false