# See https://pre-commit.com for more information
default_language_version:
    python: python3.12

default_install_hook_types: [pre-commit]
# `yml` as well as `yaml`: this repo has 16 of the former and 2 of the latter,
# so listing only `yaml` meant docker-compose.yml was checked by nothing at all
# - not check-yaml, not mixed-line-ending. That is how it was silently committed
# with CRLF endings. Note `exclude` below still drops .github/ and .devcontainer/
# (anything starting with `.` or `_`), so the workflow files remain unchecked.
files: '^(.+\.(py|ts|js|tsx|jsx|yaml|yml|toml|html|txt))$'
exclude: '(^[._]|/config/|/docs/|/downloads/|/logs/|/pgsql/|/node_modules/)'

# GITHUB
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: debug-statements

# RUFF
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        always_run: true
        pass_filenames: false

# REPOSITORY CONSISTENCY
-   repo: local
    hooks:
      - id: line-endings
        name: every tracked text file is stored with LF
        entry: python3 bin/check_line_endings.py
        language: system
        # always_run, because the point is to see files the global `files:`
        # pattern above does not match - which is exactly how the CRLF this
        # guards against got in. Reads via `git ls-files --eol` and only
        # reports; it never rewrites, so it cannot damage a binary.
        always_run: true
        pass_filenames: false
      - id: imports-tracked
        name: every urbanlens.* import resolves to a committed file
        entry: python3 bin/check_imports_tracked.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: outage-not-cached
        name: no fetch caches a swallowed failure as a result
        entry: python3 bin/check_outage_not_cached.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: notification-choke-point
        name: every notification write honours the mute preference
        entry: python3 bin/check_notification_choke_point.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: versioned-writes
        name: a model that versions fields records every write path
        entry: python3 bin/check_versioned_writes.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: signal-reachable
        name: no post_save subscription waits on a field only update() sets
        entry: python3 bin/check_signal_reachable.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: concealed-writes
        name: a wiki resolved for reading is never saved
        entry: python3 bin/check_concealed_writes.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: template-comments
        name: "Django {# comments close on the line they open"
        entry: python3 bin/check_template_comments.py
        language: system
        files: '\.(html|txt)$'
        pass_filenames: false

# CODEQL
# Manual-only. It was a pre-push hook, which made `git push` fail: the analysis
# is minutes long, exits non-zero on the repo's known-and-triaged findings, and
# a GUI client (VS Code) shows none of that output - the push just fails.
# CI still runs CodeQL on every PR (.github/workflows/security.yml).
# Run it with: bun run codeql:gate   (or python bin/run_codeql.py --gate)
-   repo: local
    hooks:
      - id: codeql
        name: CodeQL analysis (manual)
        entry: python3 bin/run_codeql.py --gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true

# TYPESCRIPT
# Manual-only, same reasoning as CodeQL above: a full project typecheck and
# the whole TS unit-test suite are the slow tail of the hook chain (minutes,
# not seconds), which made every commit wait on them regardless of how small
# the change was. Run with: bun run typecheck / bun run test:ts
# (or `pre-commit run --hook-stage manual --all-files tsc`/`bun-test`).
-   repo: local
    hooks:
      - id: tsc
        name: tsc (typescript typecheck, manual)
        entry: bun run typecheck
        language: system
        files: '\.tsx?$'
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: bun-test
        name: bun test (typescript unit tests, manual)
        entry: bun run test:ts
        language: system
        files: '\.tsx?$'
        pass_filenames: false
        always_run: true
        stages: [manual]
