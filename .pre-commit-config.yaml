# See https://pre-commit.com for more information
default_language_version:
    python: python3.12

default_install_hook_types: [pre-commit, pre-push]
files: '^(.+\.(py|ts|js|tsx|jsx|yaml|toml))$'
exclude: '(^[._]|/config/|/docs/|/downloads/|/logs/|/pgsql/|/node_modules/)'

# GITHUB
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: debug-statements

# RUFF
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        always_run: true
        pass_filenames: false

# REPOSITORY CONSISTENCY
-   repo: local
    hooks:
      - id: imports-tracked
        name: every urbanlens.* import resolves to a committed file
        entry: python3 bin/check_imports_tracked.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: outage-not-cached
        name: no fetch caches a swallowed failure as a result
        entry: python3 bin/check_outage_not_cached.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: notification-choke-point
        name: every notification write honours the mute preference
        entry: python3 bin/check_notification_choke_point.py
        language: system
        files: '\.py$'
        pass_filenames: false

# TYPESCRIPT
-   repo: local
    hooks:
      - id: tsc
        name: tsc (typescript typecheck)
        entry: bun run typecheck
        language: system
        files: '\.tsx?$'
        pass_filenames: false
      - id: bun-test
        name: bun test (typescript unit tests)
        entry: bun run test:ts
        language: system
        files: '\.tsx?$'
        pass_filenames: false