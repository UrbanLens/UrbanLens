# git-cliff configuration for UrbanLens's releases (README.md, "CI/CD and Releases").
#
# bin/release.py runs git-cliff (pinned there, through `uv tool run`) with `--context` to
# read the conventional commits on `main` since the last `vX.Y.Z` tag, grouped by the parsers
# below. It computes the next version itself and renders the CHANGELOG.md section in
# release-please's old format, sorted the way release-please sorted it. The [bump] table and
# the template below give the same version and a close preview for a by-hand run:
#
#     uv tool run --from git-cliff==2.13.1 git-cliff --unreleased --bump
#
# The section names and the hidden types are release-please's defaults for a Python package,
# which is what UrbanLens's release-please config used.

[changelog]
header = ""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}](https://github.com/UrbanLens/UrbanLens/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits %}* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/UrbanLens/UrbanLens/commit/{{ commit.id }}))
{% endfor %}{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
# Merge commits ("Merge pull request 'fix: x' (#8) from ...") are not conventional and drop
# out here; the commits they merge carry the entries.
filter_unconventional = true
split_commits = false
# No preprocessor links "(#N)": commits from before the move to Forgejo carry GitHub's pull
# request numbers, which are not Forgejo's, so a link would point at the wrong pull request.
# The order of the sections in CHANGELOG.md is bin/release.py's SECTIONS, not this list's.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^deps", group = "<!-- 5 -->Dependencies" },
  # chore, ci, build, refactor, style and test stay out of the changelog, as they did.
  { message = ".*", skip = true },
]
# A breaking change is never skipped, whatever its type.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
# release-please's bump-minor-pre-major, which UrbanLens's config set: below 1.0.0 a breaking
# change bumps the minor, not the major. A feature bumps the minor too (UrbanLens never set
# bump-patch-for-minor-pre-major), and anything else the patch. UrbanLens stays 0.x until
# the maintainer decides otherwise; bin/release.py refuses any version that is not 0.x.
features_always_bump_minor = true
breaking_always_bump_major = false
