name: urbanlens-${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}

services:
  app:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app
    build:
      <<: *app-build

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups

    networks:
      app_network:
        aliases:
          - urbanlens_app
          - urbanlens-app
      inference_network: {}

    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: web
      UL_METRICS_ENABLED: ${UL_METRICS_ENABLED:-false}
    labels:
      prometheus_scrape: "${UL_METRICS_ENABLED:-false}"
      prometheus_port: "8000"
      prometheus_path: "/metrics"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

    cpus: ${CPU_LIMIT__APP:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__APP:-2048}
    mem_limit: ${MEM_LIMIT__APP:-${MEM_LIMIT:-2g}}

    mem_reservation: ${MEM_RESERVATION__APP:-768m}
  app-ws:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app_ws
    build:
      <<: *app-build

    restart: unless-stopped

    entrypoint: ["/docker-entrypoint.sh", "daphne"]
    command:
      [
        "-b",
        "0.0.0.0",
        "-p",
        "8001",
        "--access-log",
        "/var/log/urbanlens/daphne-access.log",
        "urbanlens.UrbanLens.asgi:application",
      ]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static

    networks:
      app_network:
        aliases:
          - urbanlens_app_ws

    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: websocket
      UL_METRICS_ENABLED: "false"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__APP_WS:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__APP_WS:-2048}
    mem_limit: ${MEM_LIMIT__APP_WS:-${MEM_LIMIT:-1g}}

  nginx:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_nginx
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - ./src/urbanlens/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/urbanlens/config/nginx/django.conf:/etc/nginx/conf.d/django.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${UL_APP_PORT:-21800}:8080"
    depends_on:
      - app
      - app-ws
    networks:
      app_network:
        aliases:
          - urbanlens_nginx

    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # The spool for request bodies and buffered responses. On the image's
    # writable layer this is the same filesystem as postgres-data, and nothing
    # authenticates before a body is written - so it is a tmpfs, sized to hold
    # one maximum-size upload (client_max_body_size 200m) plus the 64m response
    # ceiling, with room to spare. Filling it refuses that upload; it cannot
    # reach the disk. mem_limit must stay above the size: tmpfs pages are
    # charged to this cgroup, and an OOM-killed nginx is the whole site.
    tmpfs:
      - /tmp:size=${TMPFS_SIZE__NGINX:-512m},mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__NGINX:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__NGINX:-1024}
    mem_limit: ${MEM_LIMIT__NGINX:-768m}
  media-nginx:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_nginx
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - media_volume:/app/src/urbanlens/media:ro
      - ./src/urbanlens/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/urbanlens/config/nginx/media.conf.template:/etc/nginx/templates/media.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    environment:
      MEDIA_FRAME_ANCESTORS: ${UL_SITE_URL:-'none'}
    ports:
      - "${UL_MEDIA_PORT:-21801}:8080"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - urbanlens_media_nginx
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Same hazard, far smaller appetite: this vhost caps a body at 64k and its
    # only proxy_pass returns an X-Accel-Redirect header, not a payload.
    tmpfs:
      - /tmp:size=${TMPFS_SIZE__MEDIA_NGINX:-64m},mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_NGINX:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__MEDIA_NGINX:-1024}
    mem_limit: ${MEM_LIMIT__MEDIA_NGINX:-${MEM_LIMIT:-128m}}

  db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_db
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      app_network:
        aliases:
          - urbanlens_db
      sandbox_network:
        aliases:
          - urbanlens_db
      ai_network:
        aliases:
          - urbanlens_db

    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
      - POSTGRES_PORT=${UL_DB_PORT:-5432}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 20s
      retries: 9

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__DB:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__DB:-2048}
    mem_limit: ${MEM_LIMIT__DB:-${MEM_LIMIT:-2g}}
    mem_reservation: ${MEM_RESERVATION__DB:-1g}

  celery-worker:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Only the interactive class. Everything whose size is set by how much one
    # account owns goes to celery-worker-bulk, so a library sweep cannot take a
    # quarter of this pool while a safety escalation waits behind it - D13.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=4",
        "-Q",
        "interactive",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups
    networks:
      - app_network
      - inference_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: worker
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_WORKER:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER:-256}
    mem_limit: ${MEM_LIMIT__CELERY_WORKER:-${MEM_LIMIT:-3g}}

  celery-worker-bulk:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker_bulk
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Drains `celery` as well as its own classes on purpose: a task added without
    # a queue then runs slowly rather than accumulating in a queue nothing
    # consumes. dashboard.checks.check_every_task_declares_a_queue is what stops
    # that becoming the normal case.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=2",
        "-Q",
        "bulk,maintenance,celery",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups
    networks:
      - app_network
      - inference_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: bulk
    stop_grace_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_WORKER_BULK:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER_BULK:-128}
    mem_limit: ${MEM_LIMIT__CELERY_WORKER_BULK:-${MEM_LIMIT:-3g}}

  celery-worker-panels:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker_panels
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--pool=threads",
        "--concurrency=20",
        "-Q",
        "panel_fetch",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: panels
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_PANELS:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER_PANELS:-256}
    mem_limit: ${MEM_LIMIT__CELERY_PANELS:-${MEM_LIMIT:-1g}}
  media-worker:
    <<: *sandbox-worker
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_worker
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=2",
        "-Q",
        "sandbox",
      ]
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_WORKER:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__MEDIA_WORKER:-128}
    mem_limit: ${MEM_LIMIT__MEDIA_WORKER:-3g}
  media-worker-batch:
    <<: *sandbox-worker
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_worker_batch
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=1",
        "-Q",
        "sandbox_batch",
      ]
    tmpfs:
      - /tmp:size=2g,mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_WORKER_BATCH:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__MEDIA_WORKER_BATCH:-64}
    mem_limit: ${MEM_LIMIT__MEDIA_WORKER_BATCH:-3g}

  celery-beat:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_beat
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "beat",
        "--loglevel=warning",
        "--schedule=/var/log/urbanlens/celerybeat-schedule",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    environment:
      <<: *beat-env
      UL_PROCESS_ROLE: beat
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_BEAT:-${CPU_LIMIT:-0.5}}
    cpu_shares: ${CPU_SHARES__CELERY_BEAT:-256}
    mem_limit: ${MEM_LIMIT__CELERY_BEAT:-${MEM_LIMIT:-512m}}
  celery-metrics:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_metrics
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "src/urbanlens/manage.py"]
    command: ["celery_metrics_exporter", "--port", "8002"]
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: metrics
      PROMETHEUS_MULTIPROC_DIR:
      UL_METRICS_ENABLED: ${UL_METRICS_ENABLED:-false}
    profiles: ["metrics"]
    labels:
      prometheus_scrape: "${UL_METRICS_ENABLED:-false}"
      prometheus_port: "8002"
      prometheus_path: "/metrics"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_METRICS:-${CPU_LIMIT:-0.5}}
    cpu_shares: ${CPU_SHARES__CELERY_METRICS:-64}
    mem_limit: ${MEM_LIMIT__CELERY_METRICS:-${MEM_LIMIT:-512m}}
  clamav:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_clamav
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: "1000M"
      CLAMD_CONF_SelfCheck: "86400"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      app_network:
        aliases:
          - urbanlens_clamav
      sandbox_network:
        aliases:
          - urbanlens_clamav
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CLAMAV:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__CLAMAV:-128}
    mem_limit: ${MEM_LIMIT__CLAMAV:-${MEM_LIMIT:-2g}}

  valkey:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_valkey
    image: valkey/valkey:7-alpine
    user: nobody
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    networks:
      app_network:
        aliases:
          - urbanlens_valkey
      sandbox_network:
        aliases:
          - urbanlens_valkey
      ai_network:
        aliases:
          - urbanlens_valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__VALKEY:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__VALKEY:-1024}
    mem_limit: ${MEM_LIMIT__VALKEY:-${MEM_LIMIT:-1g}}
  egress-proxy:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_egress_proxy
    build:
      context: ./src/urbanlens/config/egress
    restart: unless-stopped
    user: "tinyproxy:tinyproxy"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/run/tinyproxy:size=1m,mode=1777,noexec,nosuid,nodev
    networks:
      proxy_network:
        aliases:
          - urbanlens_egress_proxy
      ai_egress_network: {}
    healthcheck:
      # A complete request, not `nc -z`: a bare connect that closes without
      # sending anything makes tinyproxy log an ERROR every interval, and this
      # log is where a blocked provider call would show up. The 403 is the
      # healthy answer - tinyproxy.stats is not in the allowlist on purpose, so
      # the probe exercises parsing and policy without sending real egress.
      test:
        [
          "CMD-SHELL",
          "printf 'GET http://tinyproxy.stats/ HTTP/1.0\r\n\r\n' | nc 127.0.0.1 8888 | grep -q '^HTTP/'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__EGRESS_PROXY:-0.25}
    cpu_shares: ${CPU_SHARES__EGRESS_PROXY:-256}
    mem_limit: ${MEM_LIMIT__EGRESS_PROXY:-128m}
    pids_limit: 32
  ai-inference:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_ai_inference
    build:
      <<: *app-build
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh", "gunicorn"]
    command:
      [
        "urbanlens_ai.wsgi:application",
        "--bind",
        "0.0.0.0:8002",
        "-k",
        "gthread",
        "--threads",
        "8",
        "-w",
        "1",
        "-t",
        "120",
        # This container is read_only, so gunicorn cannot create its control
        # socket under $HOME and logs an Errno 30 every boot. Nothing drives
        # this service through that socket, and refusing it outright suits a
        # tier whose whole purpose is isolation better than a writable mount.
        "--no-control-socket",
      ]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      inference_network:
        aliases:
          - urbanlens_ai_inference
      proxy_network: {}
    env_file:
      - path: .env.ai
        required: false
    environment:
      UL_AI_INFERENCE_TOKEN: ${UL_AI_INFERENCE_TOKEN}
      UL_PROCESS_ROLE: inference
      HTTPS_PROXY: http://urbanlens_egress_proxy:8888
      HTTP_PROXY: http://urbanlens_egress_proxy:8888
      NO_PROXY: localhost,127.0.0.1
    healthcheck:
      test:
        ["CMD", "curl", "-f", "--noproxy", "*", "http://localhost:8002/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__AI_INFERENCE:-0.5}
    cpu_shares: ${CPU_SHARES__AI_INFERENCE:-512}
    mem_limit: ${MEM_LIMIT__AI_INFERENCE:-512m}
    pids_limit: 64
  ai-worker:
    <<: *sandbox-worker
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_ai_worker
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--pool=prefork",
        "--concurrency=2",
        "-Q",
        "ai",
        "--prefetch-multiplier=1",
      ]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
      ai-inference:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - ai_network
      - inference_network
      - proxy_network
    environment:
      <<: *ai-env
    pids_limit: 128
    cpus: ${CPU_LIMIT__AI_WORKER:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__AI_WORKER:-128}
    mem_limit: ${MEM_LIMIT__AI_WORKER:-${MEM_LIMIT:-1g}}
  test-runner:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_runner
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UL_ENVIRONMENT: development
        UL_CONTAINER_NAME: ${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test
    entrypoint: ["sleep", "infinity"]
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: worker
      UL_DB_HOST: localhost
      UL_DB_PORT: "5432"
      UL_VALKEY_URL: redis://localhost:6379/0
      UL_ENVIRONMENT: development
    networks:
      - app_network
    cpus: ${CPU_LIMIT__TEST_RUNNER:-${CPU_LIMIT:-6}}
    mem_limit: ${MEM_LIMIT__TEST_RUNNER:-${MEM_LIMIT:-6g}}

  test-db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_db
    profiles: ["test"]
    image: postgis/postgis:17-3.5
    network_mode: service:test-runner
    depends_on:
      - test-runner
    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 10s
      retries: 9
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__TEST_DB:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__TEST_DB:-${MEM_LIMIT:-2g}}

  test-valkey:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_valkey
    profiles: ["test"]
    image: valkey/valkey:7-alpine
    user: nobody
    network_mode: service:test-runner
    depends_on:
      - test-runner
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__TEST_VALKEY:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__TEST_VALKEY:-${MEM_LIMIT:-512m}}

volumes:
  postgres-data:
  logs:
  static_volume:
  media_volume:
  backups:
  clamav-db:

networks:
  app_network:
    driver: bridge
    enable_ipv6: false
  sandbox_network:
    driver: bridge
    internal: true
  ai_network:
    driver: bridge
    internal: true
    enable_ipv6: false
  inference_network:
    driver: bridge
    internal: true
    enable_ipv6: false
  proxy_network:
    driver: bridge
    internal: true
    enable_ipv6: false
  ai_egress_network:
    driver: bridge
    enable_ipv6: false
