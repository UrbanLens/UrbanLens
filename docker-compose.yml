# Shared build configuration - all three app containers use the same image.
# UL_ENVIRONMENT is passed as a build arg (not just a runtime env var) so the
# Dockerfile can `uv sync --no-dev` for staging/production
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    UL_ENVIRONMENT: ${UL_ENVIRONMENT:-production}
    UL_CONTAINER_NAME: ${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}

# Every UL_* value in the host .env, injected at container start rather than
# baked into the image. This block is load-bearing.
x-app-env-file: &app-env-file
  - path: .env
    required: false

# Full environment for the app server and celery workers (need all API keys).
x-app-env: &app-env
  # Read natively by gunicorn - without this, gunicorn defaults to a single worker
  # process
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
  UL_DB_USER: ${UL_DB_USER:-postgres}
  UL_DB_NAME: ${UL_DB_NAME:-postgres}
  UL_DB_PASS: ${UL_DB_PASS:-postgres}
  UL_DB_HOST: ${UL_DB_HOST:-urbanlens_db}
  UL_DB_PORT: ${UL_DB_PORT:-5432}
  UL_APP_PORT: ${UL_APP_PORT:-21800}
  UL_ENVIRONMENT: ${UL_ENVIRONMENT:-production}
  UL_SITE_URL: ${UL_SITE_URL:-http://localhost:21080}
  UL_GOOGLE_CLIENT_ID: ${UL_GOOGLE_CLIENT_ID}
  UL_GOOGLE_CLIENT_SECRET: ${UL_GOOGLE_CLIENT_SECRET}
  UL_DISCORD_CLIENT_ID: ${UL_DISCORD_CLIENT_ID}
  UL_DISCORD_CLIENT_SECRET: ${UL_DISCORD_CLIENT_SECRET}
  UL_GOOGLE_UNRESTRICTED_API_KEY: ${UL_GOOGLE_UNRESTRICTED_API_KEY}
  UL_GOOGLE_DOMAIN_RESTRICTED_API_KEY: ${UL_GOOGLE_DOMAIN_RESTRICTED_API_KEY}
  UL_GOOGLE_SEARCH_TENANT: ${UL_GOOGLE_SEARCH_TENANT}
  UL_GOOGLE_SEARCH_CX: ${UL_GOOGLE_SEARCH_CX:-${UL_GOOGLE_SEARCH_TENANT}}
  UL_OPENWEATHERMAP_API_KEY: ${UL_OPENWEATHERMAP_API_KEY}
  UL_NPS_API_KEY: ${UL_NPS_API_KEY}
  UL_OPENAI_API_KEY: ${UL_OPENAI_API_KEY}
  UL_ANTHROPIC_API_KEY: ${UL_ANTHROPIC_API_KEY}
  UL_SMITHSONIAN_API_KEY: ${UL_SMITHSONIAN_API_KEY}
  UL_VALKEY_URL: ${UL_VALKEY_URL:-redis://urbanlens_valkey:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  # Independent of DJANGO_SECRET_KEY: without it, EncryptedTextField
  # falls back to deriving its Fernet key from SECRET_KEY
  UL_FIELD_ENCRYPTION_KEY: ${UL_FIELD_ENCRYPTION_KEY}
  UL_FIELD_ENCRYPTION_KEY_FALLBACKS: ${UL_FIELD_ENCRYPTION_KEY_FALLBACKS}
  UL_PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump

# Minimal environment for celery-beat - only needs DB + broker to schedule tasks.
x-beat-env: &beat-env
  UL_DB_USER: ${UL_DB_USER:-postgres}
  UL_DB_NAME: ${UL_DB_NAME:-postgres}
  UL_DB_PASS: ${UL_DB_PASS:-postgres}
  UL_DB_HOST: ${UL_DB_HOST:-urbanlens_db}
  UL_DB_PORT: ${UL_DB_PORT:-5432}
  UL_ENVIRONMENT: ${UL_ENVIRONMENT:-production}
  UL_VALKEY_URL: ${UL_VALKEY_URL:-redis://urbanlens_valkey:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  # the encryption key must resolve the same way here or an import-time read of an
  # encrypted field would decrypt under the wrong key.
  UL_FIELD_ENCRYPTION_KEY: ${UL_FIELD_ENCRYPTION_KEY}
  UL_FIELD_ENCRYPTION_KEY_FALLBACKS: ${UL_FIELD_ENCRYPTION_KEY_FALLBACKS}

# Project name is derived from the environment so each of prod/dev/test/staging
# gets its own Compose namespace
name: urbanlens-${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}

services:
  app:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app
    build:
      <<: *app-build

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups

    networks:
      app_network:
        aliases:
          - urbanlens_app

    env_file: *app-env-file
    environment:
      <<: *app-env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

    # gunicorn (WEB_CONCURRENCY=3 by default): ~140MB/worker idle, but Pillow/
    # GDAL/GeoPandas/Shapely and per-worker DB/valkey pools all run in the
    # request path and push real traffic well above that
    cpus: ${CPU_LIMIT__APP:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__APP:-${MEM_LIMIT:-2g}}

  # Dedicated ASGI (Daphne) process for WebSocket traffic only (safety check-in
  # chat, etc).
  app-ws:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app_ws
    build:
      <<: *app-build

    restart: unless-stopped

    entrypoint: ["/docker-entrypoint.sh", "daphne"]
    # Daphne logs an access line to stdout for every request by default (verbosity=1),
    # including the docker healthcheck hitting /health/ every 30s - that's pure noise
    # in `docker logs`. Route it to the shared log volume instead so it's still on
    # disk for debugging WS issues (see channels_redis timeout tuning) without
    # flooding the console.
    command:
      [
        "-b",
        "0.0.0.0",
        "-p",
        "8001",
        "--access-log",
        "/var/log/urbanlens/daphne-access.log",
        "urbanlens.UrbanLens.asgi:application",
      ]

    # `app`'s own entrypoint runs bin/init.py (migrate + collectstatic) before
    # its healthcheck can pass - waiting on `app` being healthy, not just
    # db/valkey, is what actually guarantees the schema and static manifest
    # exist before it serves any traffic.
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static

    networks:
      app_network:
        aliases:
          - urbanlens_app_ws

    env_file: *app-env-file
    environment:
      <<: *app-env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 25s

    # Bounds this service's own stdout/stderr (startup, errors) - the per-request
    # access log is deliberately routed to the logs volume above instead, and
    # still needs its own rotation (tracked separately, see docs/GOALS_CODE_AUDIT.md
    # "Backups and logs" - this block does not cover that file).
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Single Daphne process, no fan-out - idle is ~227MB (full Django/Channels
    # registry import, unamortized). An OOM-kill here drops every open
    # WebSocket at once, so this gets generous headroom
    cpus: ${CPU_LIMIT__APP_WS:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__APP_WS:-${MEM_LIMIT:-1g}}

  nginx:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_nginx
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - ./src/urbanlens/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/urbanlens/config/nginx/django.conf:/etc/nginx/conf.d/django.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${UL_APP_PORT:-21800}:8080"
    depends_on:
      - app
      - app-ws
    networks:
      app_network:
        aliases:
          - urbanlens_nginx

    healthcheck:
      # 127.0.0.1, not localhost: inside the alpine image localhost resolves
      # to ::1 first and nginx's `listen 8080` binds IPv4 only, so the check
      # was connection-refused on every probe (container permanently
      # "unhealthy" despite serving traffic fine).
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

    # nginx's own access_log is deliberately routed to /tmp (see nginx.conf) rather
    # than stdout, so this bounds its error log/startup output, not request logs -
    # the /tmp file still needs its own rotation, tracked separately.
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # worker_processes is hardcoded to 2 in nginx.conf, and its temp paths are
    # disk-backed (not tmpfs) so uploads/sendfile don't inflate RAM - idle is
    # ~3MB. cpus matches the hardcoded worker count exactly; a third core
    # would go unused
    cpus: ${CPU_LIMIT__NGINX:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__NGINX:-${MEM_LIMIT:-128m}}

  db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_db
    # Pin to the same major version as postgresql-client-17 in the Dockerfile so
    # the pg_dump binary and server protocol stay in sync.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      app_network:
        aliases:
          - urbanlens_db

    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
      - POSTGRES_PORT=${UL_DB_PORT:-5432}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 20s
      retries: 9

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Idle RSS (~98MB) is a poor proxy: CONN_MAX_AGE=0 means every request/task
    # opens its own short-lived connection, and concurrent backends scale with
    # gunicorn+daphne+both celery workers - a plausible ~25-30 simultaneous
    # backends against default shared_buffers/work_mem.
    cpus: ${CPU_LIMIT__DB:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__DB:-${MEM_LIMIT:-2g}}

  celery-worker:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Handles every task EXCEPT external-data panel fetches, which now run on
    # celery-worker-panels below (see that service's comment for why they're
    # split out). Concurrency=4 (prefork - one OS process per slot) is plenty
    # for this queue's remaining traffic: photo/backup/export jobs and the
    # scheduled housekeeping tasks (safety check-ins, account deletion, etc),
    # none of which arrive in the same "~10 at once" bursts panel fetches did.
    # loglevel=warning: info logs a "received"/"succeeded" line for every task,
    # including the safety-checkin scheduled tasks that fire every 5 minutes -
    # that drowns out real signal in production. Failures/retries are still
    # surfaced explicitly via the task_failure/task_retry handlers in celery.py.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=4",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # --concurrency=4 prefork children, each bounded near
    # CELERY_WORKER_MAX_MEMORY_PER_CHILD (512MB, settings/base.py) - checked
    # only *after* a task finishes, so one task can still overshoot before
    # recycling. This container-level ceiling is the fast circuit breaker for
    # exactly that case. Should re-assess with time and code changes.
    cpus: ${CPU_LIMIT__CELERY_WORKER:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__CELERY_WORKER:-${MEM_LIMIT:-3g}}

  celery-worker-panels:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker_panels
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Dedicated queue + worker for external-data panel fetches
    # Split out from celery-worker
    # above because a cold pin detail page enqueues ~10 of these small,
    # mostly-IO-bound tasks at once
    #
    # --pool=threads instead of prefork: one thread per task costs kilobytes
    # letting --concurrency go higher for the same resource budget.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--pool=threads",
        "--concurrency=20",
        "-Q",
        "panel_fetch",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # --pool=threads: one process, so memory isn't multiplied per concurrent
    # task the way celery-worker's prefork pool is - idle is ~242MB with
    # GDAL/GeoPandas/Pillow already resident. 
    cpus: ${CPU_LIMIT__CELERY_PANELS:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__CELERY_PANELS:-${MEM_LIMIT:-1g}}

  celery-beat:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_beat
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # loglevel=warning: info logs "Scheduler: Sending due task ..." on every beat tick
    # (every 5 minutes for the safety-checkin tasks alone), which is pure noise once
    # the schedule is known-good.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "beat",
        "--loglevel=warning",
        "--schedule=/var/log/urbanlens/celerybeat-schedule",
      ]
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    environment:
      <<: *beat-env
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Scheduler only - never executes a task body, so none of the heavy
    # per-task-type lazy imports (GeoPandas/Shapely/Pillow/...) that inflate
    # the actual workers ever trigger here. 
    cpus: ${CPU_LIMIT__CELERY_BEAT:-${CPU_LIMIT:-0.5}}
    mem_limit: ${MEM_LIMIT__CELERY_BEAT:-${MEM_LIMIT:-512m}}

  # clamd daemon every upload is scanned through before
  # it's ever written to permanent storage
  clamav:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_clamav
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    environment:
      # StreamMaxLength is unset by default, which falls back to clamd's own
      # compiled-in default
      CLAMD_CONF_StreamMaxLength: "1000M"
      # clamd has no separate log-level control for its heartbeat -
      # so the only lever is how often it runs.
      CLAMD_CONF_SelfCheck: "86400"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      app_network:
        aliases:
          - urbanlens_clamav
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Measured steady-state (clamd loads its full signature DB into RAM at
    # startup) is already 950MB-1020MB
    # with zero headroom for the ~2x transient spike SelfCheck's daily
    # signature reload can cause while the old DB is still resident. 
    cpus: ${CPU_LIMIT__CLAMAV:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__CLAMAV:-${MEM_LIMIT:-2g}}

  valkey:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_valkey
    image: valkey/valkey:7-alpine
    user: nobody
    restart: unless-stopped
    # volatile-lru: this instance is shared by the Django cache,
    # the Channels layer, and the Celery broker/result backend. volatile-lru
    # only evicts keys with a TTL, so queued Celery tasks are never silently
    # dropped; if memory is exhausted, writes fail loudly (OOM) instead.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    networks:
      app_network:
        aliases:
          - urbanlens_valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # --maxmemory 512mb (above) already hard-caps the dataset
    # 1g covers allocator
    # fragmentation and fork()-based COW headroom above the internal cap
    cpus: ${CPU_LIMIT__VALKEY:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__VALKEY:-${MEM_LIMIT:-1g}}

  # --- Test topology (opt-in: docker compose --profile test ...) -------------
  # pytest's LocalhostOnlyNetwork guard (core/tests/testing_network.py) only
  # permits loopback connections, which the normal service topology can't
  # satisfy - UL_VALKEY_URL/UL_DB_HOST resolve to container-bridge IPs, so
  # running pytest inside `app` trips the guard on legitimate same-stack
  # traffic
  #
  # Usage (fresh throwaway DB every time - no volumes are mounted):
  #   docker compose --profile test up -d --build test-runner test-db test-valkey
  #   docker compose exec -e UL_TEST_DB_NAME=ul_test_$RANDOM test-runner \
  #     python -m pytest src/urbanlens/dashboard/tests/
  test-runner:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_runner
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Always a dev-grade build
        UL_ENVIRONMENT: development
        UL_CONTAINER_NAME: ${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test
    # Bypass /docker-entrypoint.sh: init.py runs migrate+collectstatic
    entrypoint: ["sleep", "infinity"]
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_DB_HOST: localhost
      UL_DB_PORT: "5432"
      UL_VALKEY_URL: redis://localhost:6379/0
      UL_ENVIRONMENT: development
    networks:
      - app_network
    # pytest-xdist spawns real subprocesses (execnet), not fork+COW - each
    # worker independently pays the full Django+GDAL+GeoPandas+Shapely+Pillow
    # import cost. Only started on-demand (--profile test), so more
    # generosity than the always-on services is acceptable. 
    cpus: ${CPU_LIMIT__TEST_RUNNER:-${CPU_LIMIT:-6}}
    mem_limit: ${MEM_LIMIT__TEST_RUNNER:-${MEM_LIMIT:-6g}}

  test-db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_db
    profiles: ["test"]
    image: postgis/postgis:17-3.5
    # Shares test-runner's network namespace so it listens on the runner's
    # localhost:5432. No data volume on purpose: every `up` starts pristine.
    network_mode: service:test-runner
    depends_on:
      - test-runner
    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 10s
      retries: 9
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Fixture-scale data, no persistent volume - covers several xdist
    # per-worker databases running DDL/DML concurrently. 
    cpus: ${CPU_LIMIT__TEST_DB:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__TEST_DB:-${MEM_LIMIT:-2g}}

  test-valkey:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_valkey
    profiles: ["test"]
    image: valkey/valkey:7-alpine
    user: nobody
    network_mode: service:test-runner
    depends_on:
      - test-runner
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # --maxmemory 256mb (above) already hard-caps this one, same reasoning as
    # the production valkey service. 
    cpus: ${CPU_LIMIT__TEST_VALKEY:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__TEST_VALKEY:-${MEM_LIMIT:-512m}}

volumes:
  postgres-data:
  logs:
  static_volume:
  media_volume:
  backups:
  clamav-db:

networks:
  app_network:
    driver: bridge
    # Docker defaults new bridge networks to dual-stack.
    # Disable IPv6 here so only the working A record is ever returned.
    enable_ipv6: false
