name: urbanlens-${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}

services:
  app:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app
    build:
      <<: *app-build

    restart: unless-stopped
    command: ["python", "/app/bin/container_init.py", "--no-db"]

    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      channel-layer:
        condition: service_healthy
      tile-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups

    networks:
      app_network:
        aliases:
          - urbanlens_app
          - urbanlens-app

    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: web
      UL_DB_USER: ul_web
      UL_METRICS_ENABLED: ${UL_METRICS_ENABLED:-false}
      # A login costs more CPU than a poll's own Python; each gthread request thread keeps its connection.
      UL_DB_CONN_MAX_AGE: "300"
      UL_DB_CONN_HEALTH_CHECKS: "true"
    labels:
      prometheus_scrape: "${UL_METRICS_ENABLED:-false}"
      prometheus_port: "8000"
      prometheus_path: "/metrics"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

    cpus: ${CPU_LIMIT__APP:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__APP:-2048}
    mem_limit: ${MEM_LIMIT__APP:-${MEM_LIMIT:-2g}}

    mem_reservation: ${MEM_RESERVATION__APP:-768m}
  app-ws:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_app_ws
    build:
      <<: *app-build

    restart: unless-stopped

    entrypoint: ["/docker-entrypoint.sh", "daphne"]
    command:
      [
        "-b",
        "0.0.0.0",
        "-p",
        "8001",
        "--access-log",
        "/var/log/urbanlens/daphne-access.log",
        "urbanlens.UrbanLens.asgi:application",
      ]
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      channel-layer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_healthy

    volumes:
      - logs:/var/log/urbanlens
      - static_volume:/app/src/urbanlens/frontend/static

    networks:
      app_network:
        aliases:
          - urbanlens_app_ws

    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: websocket
      UL_DB_USER: ul_websocket
      UL_METRICS_ENABLED: "false"
      # Channels makes every database call on one thread, so the connection is kept rather than logged into per call.
      UL_DB_CONN_MAX_AGE: "300"
      UL_DB_CONN_HEALTH_CHECKS: "true"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__APP_WS:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__APP_WS:-2048}
    mem_limit: ${MEM_LIMIT__APP_WS:-${MEM_LIMIT:-1g}}

  nginx:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_nginx
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - static_volume:/app/src/urbanlens/frontend/static
      - media_volume:/app/src/urbanlens/media
      - ./src/urbanlens/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/urbanlens/config/nginx/django.conf.template:/etc/nginx/templates/django.conf.template:ro
      - ./src/urbanlens/config/nginx/10-trusted-proxies.sh:/docker-entrypoint.d/10-trusted-proxies.sh:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    environment:
      UL_APP_PORT: ${UL_APP_PORT:-21800}
      UL_TRUSTED_PROXY_CIDRS: ${UL_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${UL_APP_PORT:-21800}:8080"
    depends_on:
      - app
      - app-ws
    networks:
      app_network:
        aliases:
          - urbanlens_nginx

    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Unauthenticated bodies share filesystem with postgres-data, so tmpfs:
    # sized for one max upload (200m) plus 64m response ceiling.
    # Filling it refuses that upload without reaching disk.
    # mem_limit must stay above size or OOM kills nginx.
    tmpfs:
      - /tmp:size=${TMPFS_SIZE__NGINX:-512m},mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__NGINX:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__NGINX:-1024}
    mem_limit: ${MEM_LIMIT__NGINX:-768m}
  media-nginx:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_nginx
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - media_volume:/app/src/urbanlens/media:ro
      - ./src/urbanlens/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/urbanlens/config/nginx/media.conf.template:/etc/nginx/templates/media.conf.template:ro
      - ./src/urbanlens/config/nginx/10-trusted-proxies.sh:/docker-entrypoint.d/10-trusted-proxies.sh:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    environment:
      MEDIA_FRAME_ANCESTORS: ${UL_SITE_URL:-'none'}
      UL_TRUSTED_PROXY_CIDRS: ${UL_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${UL_MEDIA_PORT:-21801}:8080"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - urbanlens_media_nginx
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Same hazard, far smaller appetite: this vhost caps a body at 64k and its
    # only proxy_pass returns an X-Accel-Redirect header, not a payload.
    tmpfs:
      - /tmp:size=${TMPFS_SIZE__MEDIA_NGINX:-64m},mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_NGINX:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__MEDIA_NGINX:-1024}
    mem_limit: ${MEM_LIMIT__MEDIA_NGINX:-${MEM_LIMIT:-128m}}

  db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_db
    build:
      context: ./src/urbanlens/config/postgres
    restart: unless-stopped
    command:
      - postgres
      # JIT's compile time outweighs the short statements a web request runs.
      - "-c"
      - "jit=off"
      # Where the time goes is not answerable after the fact without this, and it was reached for
      # by hand on the perf deployment rather than configured. Preloading costs a little
      # shared memory whether or not any database has run CREATE EXTENSION (migration 0032_v0_8_0).
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      # Postgres's own default is off, and measuring its cost here was defeated by host noise.
      # Planning-figure measurements need it, so a deployment doing that measurement turns it on.
      - "-c"
      - "pg_stat_statements.track_planning=${UL_DB_TRACK_PLANNING:-off}"
      # Stock is 128MB, which is smaller than the database. Sized against MEM_LIMIT__DB, not the host.
      - "-c"
      - "shared_buffers=${UL_DB_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${UL_DB_EFFECTIVE_CACHE_SIZE:-1536MB}"
      # Stock 4.0 prices a seek at four sequential reads, which is a spinning disk.
      - "-c"
      - "random_page_cost=${UL_DB_RANDOM_PAGE_COST:-1.1}"
    # Parallel workers pass tuples through /dev/shm, which Docker leaves at 64MB.
    shm_size: ${UL_DB_SHM_SIZE:-256mb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      app_network:
        aliases:
          - urbanlens_db
      sandbox_network:
        aliases:
          - urbanlens_db

    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
      - POSTGRES_PORT=${UL_DB_PORT:-5432}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 20s
      retries: 9

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__DB:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__DB:-2048}
    mem_limit: ${MEM_LIMIT__DB:-${MEM_LIMIT:-2g}}
    mem_reservation: ${MEM_RESERVATION__DB:-1g}

  db-setup:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_db_setup
    build:
      <<: *app-build
    # The only service given the owner's credentials: it migrates, converges every tier's login role,
    # and exits. Everything that connects to the database waits for it.
    command: ["python", "/app/bin/container_init.py", "--db-only"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: setup
      UL_DB_USER: ${UL_DB_USER:-postgres}
      UL_DB_PASS: ${UL_DB_PASS:-postgres}
      UL_DB_APP_PASS: ${UL_DB_APP_PASS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: 1
    mem_limit: 2g

  celery-worker:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Only the interactive class. Everything whose size is set by how much one
    # account owns goes to celery-worker-bulk, so a library sweep cannot take a
    # quarter of this pool while a safety escalation waits behind it.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=4",
        "-Q",
        "interactive",
      ]
    restart: on-failure
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      channel-layer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: worker
      UL_DB_USER: ul_worker
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_WORKER:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER:-256}
    mem_limit: ${MEM_LIMIT__CELERY_WORKER:-${MEM_LIMIT:-3g}}

  celery-worker-bulk:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker_bulk
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    # Drains `celery` as well as its own classes on purpose: a task added without
    # a queue then runs slowly rather than accumulating in a queue nothing
    # consumes. dashboard.checks.check_every_task_declares_a_queue is what stops
    # that becoming the normal case.
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=2",
        "-Q",
        "bulk,maintenance,celery",
      ]
    restart: on-failure
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      channel-layer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
      - media_volume:/app/src/urbanlens/media
      - backups:/app/src/backups
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: bulk
      UL_DB_USER: ul_bulk
    stop_grace_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_WORKER_BULK:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER_BULK:-128}
    mem_limit: ${MEM_LIMIT__CELERY_WORKER_BULK:-${MEM_LIMIT:-3g}}

  celery-worker-panels:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_worker_panels
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--pool=threads",
        "--concurrency=20",
        "-Q",
        "panel_fetch",
      ]
    restart: on-failure
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      channel-layer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: panels
      UL_DB_USER: ul_panels
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_PANELS:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__CELERY_WORKER_PANELS:-256}
    mem_limit: ${MEM_LIMIT__CELERY_PANELS:-${MEM_LIMIT:-1g}}
  media-worker:
    <<: *sandbox-worker
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_worker
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=2",
        "-Q",
        "sandbox",
      ]
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_WORKER:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__MEDIA_WORKER:-128}
    mem_limit: ${MEM_LIMIT__MEDIA_WORKER:-3g}
  media-worker-batch:
    <<: *sandbox-worker
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_media_worker_batch
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "worker",
        "--loglevel=warning",
        "--concurrency=1",
        "-Q",
        "sandbox_batch",
      ]
    tmpfs:
      - /tmp:size=2g,mode=1777,noexec,nosuid,nodev
    cpus: ${CPU_LIMIT__MEDIA_WORKER_BATCH:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__MEDIA_WORKER_BATCH:-64}
    mem_limit: ${MEM_LIMIT__MEDIA_WORKER_BATCH:-3g}

  celery-beat:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_beat
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "-m", "celery"]
    command:
      [
        "-A",
        "urbanlens.UrbanLens",
        "beat",
        "--loglevel=warning",
        "--schedule=/var/log/urbanlens/celerybeat-schedule",
      ]
    restart: on-failure
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    environment:
      <<: *beat-env
      UL_PROCESS_ROLE: beat
      UL_DB_USER: ul_beat
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_BEAT:-${CPU_LIMIT:-0.5}}
    cpu_shares: ${CPU_SHARES__CELERY_BEAT:-256}
    mem_limit: ${MEM_LIMIT__CELERY_BEAT:-${MEM_LIMIT:-512m}}
  celery-metrics:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_celery_metrics
    build:
      <<: *app-build
    entrypoint: ["/docker-entrypoint.sh", "python", "src/urbanlens/manage.py"]
    command: ["celery_metrics_exporter", "--port", "8002"]
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - logs:/var/log/urbanlens
    networks:
      - app_network
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: metrics
      UL_DB_USER: ul_metrics
      PROMETHEUS_MULTIPROC_DIR:
      UL_METRICS_ENABLED: ${UL_METRICS_ENABLED:-false}
    profiles: ["metrics"]
    labels:
      prometheus_scrape: "${UL_METRICS_ENABLED:-false}"
      prometheus_port: "8002"
      prometheus_path: "/metrics"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CELERY_METRICS:-${CPU_LIMIT:-0.5}}
    cpu_shares: ${CPU_SHARES__CELERY_METRICS:-64}
    mem_limit: ${MEM_LIMIT__CELERY_METRICS:-${MEM_LIMIT:-512m}}
  clamav:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_clamav
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: "1000M"
      CLAMD_CONF_SelfCheck: "86400"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      app_network:
        aliases:
          - urbanlens_clamav
      sandbox_network:
        aliases:
          - urbanlens_clamav
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CLAMAV:-${CPU_LIMIT:-2}}
    cpu_shares: ${CPU_SHARES__CLAMAV:-128}
    mem_limit: ${MEM_LIMIT__CLAMAV:-${MEM_LIMIT:-2g}}

  dragonfly:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    user: nobody
    restart: unless-stopped
    command:
      [
        # Threads track cpu limit for multi-core scaling; maxmemory needs
        # >=256MiB per thread or startup refuses, mem_limit above maxmemory.
        # No cache_mode: silent eviction differs from the raise that
        # ResilientRedisCache's _REFUSED handling expects.
        "--maxmemory=${UL_DRAGONFLY_MAXMEMORY:-1gb}",
        "--proactor_threads=${UL_DRAGONFLY_THREADS:-4}",
      ]
    networks:
      app_network:
        aliases:
          - urbanlens_dragonfly
      sandbox_network:
        aliases:
          - urbanlens_dragonfly
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__DRAGONFLY:-${CPU_LIMIT:-4}}
    cpu_shares: ${CPU_SHARES__DRAGONFLY:-1024}
    mem_limit: ${MEM_LIMIT__DRAGONFLY:-${MEM_LIMIT:-2g}}

  tile-cache:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_tile_cache
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    user: nobody
    restart: unless-stopped
    command:
      [
        # Unbounded proxied tiles (keyed by layer+coordinate, week TTL) kept
        # separate so panning cannot crowd out sessions/Channels layer.
        # cache_mode on here: LRU eviction suits a pure cache; the other
        # instance cannot use it because evicting a Channels key breaks sockets.
        "--cache_mode=true",
        "--maxmemory=${UL_TILE_CACHE_MAXMEMORY:-512mb}",
        "--proactor_threads=${UL_TILE_CACHE_THREADS:-2}",
      ]
    networks:
      app_network:
        aliases:
          - urbanlens_tile_cache
      sandbox_network:
        aliases:
          - urbanlens_tile_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__TILE_CACHE:-1}
    cpu_shares: ${CPU_SHARES__TILE_CACHE:-512}
    mem_limit: ${MEM_LIMIT__TILE_CACHE:-1g}

  channel-layer:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_channel_layer
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    user: nobody
    restart: unless-stopped
    command:
      [
        # The Channels layer and nothing else. The shared instance refuses writes once full, and a
        # refused group_send is a live message nobody receives; here the layer's own capacity and
        # expiry bound what is held. No cache_mode, for the shared instance's reason: evicting a
        # Channels key breaks a live socket. 256MiB is Dragonfly's floor per thread.
        "--maxmemory=${UL_CHANNEL_LAYER_MAXMEMORY:-256mb}",
        "--proactor_threads=${UL_CHANNEL_LAYER_THREADS:-1}",
      ]
    networks:
      app_network:
        aliases:
          - urbanlens_channel_layer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__CHANNEL_LAYER:-0.5}
    cpu_shares: ${CPU_SHARES__CHANNEL_LAYER:-512}
    mem_limit: ${MEM_LIMIT__CHANNEL_LAYER:-384m}

  rabbitmq:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_rabbitmq
    # 3.13, not 4.x: kombu declares the worker's pidbox queue transient and non-exclusive, which 4.x refuses
    # (INTERNAL_ERROR 541), so the worker crash-loops (seen with kombu 5.6.2, celery 5.6.3). Renovate holds it below 4.
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      # A task's delivery is unacknowledged through its countdown (at most 6 h), its wait for a pool slot and its run
      # (at most 6600 s); past the default 30 minutes the broker closes the channel and the worker exits.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 43200000"
      RABBITMQ_DEFAULT_USER: ${UL_RABBITMQ_USER:-urbanlens}
      RABBITMQ_DEFAULT_PASS: ${UL_RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${UL_RABBITMQ_VHOST:-urbanlens}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - urbanlens_rabbitmq
      sandbox_network:
        aliases:
          - urbanlens_rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__RABBITMQ:-${CPU_LIMIT:-1}}
    cpu_shares: ${CPU_SHARES__RABBITMQ:-1024}
    mem_limit: ${MEM_LIMIT__RABBITMQ:-${MEM_LIMIT:-1g}}

  test-runner:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_runner
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UL_ENVIRONMENT: development
        UL_CONTAINER_NAME: ${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test
    entrypoint: ["sleep", "infinity"]
    env_file: *app-env-file
    environment:
      <<: *app-env
      UL_PROCESS_ROLE: worker
      UL_DB_USER: ${UL_DB_USER:-postgres}
      UL_DB_PASS: ${UL_DB_PASS:-postgres}
      UL_DB_HOST: localhost
      UL_DB_PORT: "5432"
      UL_DRAGONFLY_URL: redis://localhost:6379/0
      UL_CHANNEL_LAYER_URL: redis://localhost:6379/0
      UL_RABBITMQ_URL: amqp://${UL_RABBITMQ_USER:-urbanlens}:${UL_RABBITMQ_PASS:-guest}@localhost:5672/${UL_RABBITMQ_VHOST:-urbanlens}
      UL_ENVIRONMENT: development
    networks:
      - app_network
    cpus: ${CPU_LIMIT__TEST_RUNNER:-${CPU_LIMIT:-6}}
    mem_limit: ${MEM_LIMIT__TEST_RUNNER:-${MEM_LIMIT:-6g}}

  test-db:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_db
    profiles: ["test"]
    build:
      context: ./src/urbanlens/config/postgres
    network_mode: service:test-runner
    depends_on:
      - test-runner
    environment:
      - POSTGRES_USER=${UL_DB_USER:-postgres}
      - POSTGRES_DB=${UL_DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${UL_DB_PASS:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${UL_DB_USER:-postgres}"]
      interval: 10s
      timeout: 10s
      retries: 9
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    # Docker's 64 MB default runs out once several suites build their databases at once: parallel queries
    # cannot size their shared memory, and a backend has segfaulted after that, restarting the server.
    shm_size: ${UL_TEST_DB_SHM_SIZE:-512mb}
    cpus: ${CPU_LIMIT__TEST_DB:-${CPU_LIMIT:-2}}
    mem_limit: ${MEM_LIMIT__TEST_DB:-${MEM_LIMIT:-2g}}

  test-dragonfly:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_dragonfly
    profiles: ["test"]
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    user: nobody
    network_mode: service:test-runner
    depends_on:
      - test-runner
    command:
      [
        "--maxmemory=256mb",
        "--proactor_threads=1",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__TEST_DRAGONFLY:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__TEST_DRAGONFLY:-${MEM_LIMIT:-512m}}

  test-rabbitmq:
    container_name: urbanlens_${UL_CONTAINER_NAME:-${UL_ENVIRONMENT:-production}}_test_rabbitmq
    profiles: ["test"]
    image: rabbitmq:3.13-management-alpine
    network_mode: service:test-runner
    depends_on:
      - test-runner
    environment:
      RABBITMQ_DEFAULT_USER: ${UL_RABBITMQ_USER:-urbanlens}
      RABBITMQ_DEFAULT_PASS: ${UL_RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${UL_RABBITMQ_VHOST:-urbanlens}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    cpus: ${CPU_LIMIT__TEST_RABBITMQ:-${CPU_LIMIT:-1}}
    mem_limit: ${MEM_LIMIT__TEST_RABBITMQ:-${MEM_LIMIT:-512m}}

volumes:
  postgres-data:
  logs:
  static_volume:
  media_volume:
  backups:
  clamav-db:
  rabbitmq-data:

networks:
  app_network:
    driver: bridge
    enable_ipv6: false
  sandbox_network:
    driver: bridge
    internal: true
