# Historic Kirkbride-plan asylum campuses, plus Harlem Valley, that the live-locations suite checks.
#
# Source: the "Notable Kirkbride hospitals / United States" table of Wikipedia's "Kirkbride Plan"
# article (2026-10-05), coordinates from each article or its Wikidata item (P625), NRHP
# reference numbers from the table or Wikidata (P649). St. Lawrence and Harlem Valley are
# added by hand; Harlem Valley is not a Kirkbride but is a required reference campus.
# Omitted for want of any published coordinate: Mount Pleasant State Hospital (IA),
# Nevada State Hospital (MO), San Antonio State Hospital (TX).
#
# tier = "primary": anchor verified by hand; every check must pass.
# status = "demolished": the Kirkbride building is gone, so building checks do not apply.
# known_issues maps a check name to the problem id tracking why it fails today; the test
# for that check is marked xfail(strict=True), so a fix turns it red until the entry goes.

