worker_processes 2;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # One address may hold at most 60 of the worker_connections pool above. The
    # application caps sockets per *account*
    # (services/security/socket_budget.py), which is the isolation that matters
    # and which cannot cover the case this does: a handshake that never
    # authenticates still occupies a connection here and a slot in daphne before
    # Django closes it. Keyed on the real address, which the vhost establishes
    # with set_real_ip_from/real_ip_header before this is evaluated.
    #
    # http{}, not events{}: a shared-memory zone is an http-level object, and
    # nginx refuses to start outright if it is declared anywhere else.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # nginx-unprivileged: write temp files to /tmp, not the root-owned defaults.
    # /tmp is a sized tmpfs (docker-compose.yml), so a spooled request body is a
    # bounded RAM area rather than write pressure on the disk holding
    # postgres-data - the image's writable layer is that same filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Per connection, against nginx's 1024m default. Past this nginx stops
    # buffering and streams at the client's pace, so the cost of a large
    # response is a held upstream connection rather than a full spool - which
    # is the right way round, and bounded either way.
    proxy_max_temp_file_size 64m;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Answer "Server: nginx" instead of "Server: nginx/1.31.3". A precise version
    # is free reconnaissance - it tells a scanner exactly which advisories to try
    # before it sends a single interesting request. Also drops the version from
    # nginx's own error pages.
    server_tokens off;

    # The timing fields are not decoration. When the map endpoint was 504ing,
    # this log could say a request failed and nothing else - not how long the
    # upstream had been given, not whether nginx gave up or the worker did. A
    # 504 nginx generates while gunicorn is still computing looks identical here
    # to one gunicorn returned, and telling those apart is the whole diagnosis.
    #
    #   rt  - total time nginx spent on the request, client included
    #   urt - time the upstream took; missing (-) when nginx never got a response,
    #         which is the signature of a proxy_read_timeout rather than an app error
    #   ust - the upstream's own status, so a 504 with ust=- is nginx giving up
    #         and a 500 with ust=500 is the app answering
    #   uct - connection time, which separates "upstream busy" from "upstream slow"
    #   up  - which upstream served it, for when there is more than one pool (D11)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time '
                      'ust=$upstream_status uct=$upstream_connect_time up=$upstream_addr';

    # Header/nav widgets (unread-count badge, safety banner, friend list) reload
    # on every page navigation, and the notification socket reconnects with them -
    # logging all of that drowns out real traffic. Skip logging just the
    # successful hits; non-2xx/non-101 responses from these still get logged so
    # real failures (auth errors, 5xxs) stay visible.
    map $request_uri $is_polling_endpoint {
        default                                    0;
        ~^/dashboard/notifications/unread-count/   1;
        ~^/dashboard/safety/nav-banner/             1;
        ~^/dashboard/friendship/list/               1;
        ~^/ws/notifications/                        1;
    }

    map $status $is_success_status {
        default    0;
        ~^(2|101)  1;
    }

    map "$is_polling_endpoint:$is_success_status" $loggable {
        default  1;
        "1:1"    0;
    }

    # /var/log/nginx/access.log is symlinked to /dev/stdout at image build time,
    # so this goes to `docker logs` - and therefore through the json-file
    # driver's max-size/max-file rotation, which is the only rotator either
    # nginx container has. A plain file (this was /tmp/nginx-requests.log) grows
    # unbounded until the container restarts, and doubly so now that media-nginx
    # includes this same config and serves the highest-volume request class on
    # the site. Nothing ever read that file.
    #
    # /var/log/nginx/ itself is not writable for *new* files by the
    # nginx-unprivileged runtime user ("open() /var/log/nginx/requests.log
    # failed (13: Permission denied)" on a prior attempt) - only the pre-made
    # symlinks in it work, which is why this is that exact filename.
    access_log  /var/log/nginx/access.log  main if=$loggable;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/x-ndjson text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
