worker_processes 2;
# The container's soft descriptor limit is 1024, and a proxied socket holds two.
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 32768;
}

http {
    # Cap unauthenticated handshakes per real address (vhost set_real_ip_from);
    # per-account budget in socket_budget.py cannot cover pre-auth nginx/daphne slots.
    # Must live in http{}: shared-memory zones fail to start elsewhere.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # nginx-unprivileged: write temp files to /tmp, not the root-owned defaults.
    # /tmp is a sized tmpfs (docker-compose.yml), so a spooled request body is a
    # bounded RAM area rather than write pressure on the disk holding
    # postgres-data - the image's writable layer is that same filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Per connection, against nginx's 1024m default. Past this nginx stops
    # buffering and streams at the client's pace, so the cost of a large
    # response is a held upstream connection rather than a full spool - which
    # is the right way round, and bounded either way.
    proxy_max_temp_file_size 64m;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Answer "Server: nginx" instead of "Server: nginx/1.31.3". A precise version
    # is free reconnaissance - it tells a scanner exactly which advisories to try
    # before it sends a single interesting request. Also drops the version from
    # nginx's own error pages.
    server_tokens off;

    # Timing fields separate nginx timeouts from app errors: ust=- with urt=- means
    # nginx gave up (proxy_read_timeout); ust=5xx means the app answered.
    # rt=total incl. client, urt=upstream, uct=connect time, up=upstream addr.
    # Logs $uri, not $request, whose query string can carry a WebSocket ?key= credential.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time '
                      'ust=$upstream_status uct=$upstream_connect_time up=$upstream_addr';

    # Polling/nav endpoints drown out real traffic; skip successful hits only,
    # so non-2xx/non-101 failures stay visible.
    map $request_uri $is_polling_endpoint {
        default                                    0;
        ~^/dashboard/notifications/unread-count/   1;
        ~^/dashboard/safety/nav-banner/             1;
        ~^/dashboard/friendship/list/               1;
        ~^/ws/notifications/                        1;
    }

    map $status $is_success_status {
        default    0;
        ~^(2|101)  1;
    }

    map "$is_polling_endpoint:$is_success_status" $loggable {
        default  1;
        "1:1"    0;
    }

    # Log via stdout symlink for docker-logs rotation; plain files grow unbounded,
    # worse now media-nginx shares this config for high-volume traffic.
    # nginx-unprivileged can only write pre-made symlinks in /var/log/nginx/,
    # hence this exact filename.
    access_log  /var/log/nginx/access.log  main if=$loggable;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/x-ndjson text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
