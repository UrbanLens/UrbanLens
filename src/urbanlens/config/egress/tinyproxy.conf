# Egress allowlist for the AI sandbox tier - see docs/AI_PIPELINE.md.
#
# This is the actual network boundary the "no REData, no web" promise rests
# on: ai-inference and ai-worker are otherwise on `internal: true` Docker
# networks with no gateway and no NAT, so this proxy is their only possible
# route to the internet, and it only forwards to a host in `filter` below.
# Everything in services/sandbox/guard.py and services/ai/tools is a
# fail-fast code-level guard on top of this, not a substitute for it - see
# test_ai_isolation.py's EgressFilterTests for what keeps `filter` itself
# honest against the hosts those tools actually call.

# No User/Group directive: that would have tinyproxy setuid/setgid itself
# from root to the `tinyproxy` account at startup, which needs
# CAP_SETUID/CAP_SETGID - dropped by the compose service's own
# `cap_drop: [ALL]`. The container instead starts as `tinyproxy` directly
# (`user: "tinyproxy:tinyproxy"` in docker-compose.yml), so there is no
# privilege left to drop.
Port 8888
Listen 0.0.0.0
Timeout 60

# Silence the Via header this would otherwise add to forwarded requests -
# there is no reason to advertise the proxy's presence to the provider APIs
# on the other end.
DisableViaHeader Yes

LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"

# The allowlist. FilterDefaultDeny means every host not matched by a `filter`
# entry is refused; FilterExtended turns each line into an anchored regex
# (see `filter`) rather than a plain substring match, so
# "api.anthropic.com.evil.example" cannot pass by containing the allowed
# domain as a substring.
Filter "/etc/tinyproxy/filter"
FilterExtended Yes
FilterDefaultDeny Yes

# CONNECT tunneling (what an HTTPS request actually issues through a proxy)
# is allowed only to port 443 - a caller cannot use this proxy to reach an
# allowlisted host's *other* ports.
ConnectPort 443
