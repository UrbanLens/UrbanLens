# Egress allowlist for the AI sandbox tier - see docs/AI_PIPELINE.md.
#
# This is the actual network boundary the plan's "no REData, no web" promise
# rests on: ai-inference and (once it exists) ai-worker are otherwise on
# `internal: true` Docker networks with no gateway and no NAT, so this proxy
# is their only possible route to the internet, and it only forwards a
# CONNECT tunnel to a host in `filter` below. Everything in
# services/sandbox/guard.py and services/ai/tools is a fail-fast code-level
# guard on top of this, not a substitute for it.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 60

# Silence the Via header this would otherwise add to forwarded requests -
# there is no reason to advertise the proxy's presence to the provider APIs
# on the other end.
DisableViaHeader Yes

LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"

# The allowlist. FilterDefaultDeny means every host not matched by a `filter`
# entry is refused; FilterExtended turns each line into an anchored regex
# (see `filter`) rather than a plain substring match, so
# "api.anthropic.com.evil.example" cannot pass by containing the allowed
# domain as a substring.
Filter "/etc/tinyproxy/filter"
FilterExtended Yes
FilterDefaultDeny Yes

# CONNECT tunneling (what an HTTPS request actually issues through a proxy)
# is allowed only to port 443 - a caller cannot use this proxy to reach an
# allowlisted host's *other* ports.
ConnectPort 443
