{% load dashboard_tags %}
{% comment %}External category/tag chips - read-only classification data captured from OpenStreetMap/Overture Maps, strictly separate.{% endcomment %}
{% if tags %}
<div class="card wiki-card" id="wiki-external-tags-card" data-collapse-scope="wiki" data-collapse-section="external_tags">
    <div class="card-header">
        <i class="material-symbols-outlined">sell</i>
        <h2>Categories</h2>
    </div>
    <div class="tag-chips-row card__body">
        {% for tag in tags %}
        <span class="tag-chip tag-chip--{{ tag.source }}" title="{{ tag.key }}">
            <span class="tag-chip-name">{{ tag.value|humanize_tag_value }}</span>
        </span>
        {% endfor %}
    </div>
</div>
{% endif %}
