{% comment %}Reusable collapsible page explainer panel with optional visual column.{% endcomment %}
<div class="ul-page-explainer{% if modifier %} ul-page-explainer--{{ modifier }}{% endif %}{% if not visual_template %} ul-page-explainer--text-only{% endif %}"
     id="{{ explainer_id }}"
     data-explainer-id="{{ explainer_id }}"
     data-explainer-anchor="#{{ anchor_id|default:explainer_id }}-anchor"
     hidden>
    <button type="button" class="ul-explainer-collapse" aria-label="Hide explanation" title="Hide explanation">
        <i class="material-icons" aria-hidden="true">expand_less</i>
    </button>
    <div class="ul-page-explainer__inner">
        <div class="ul-page-explainer__copy">
            {% if kicker %}<span class="ul-page-explainer__kicker">{{ kicker }}</span>{% endif %}
            <h3 class="ul-page-explainer__heading">{{ heading }}</h3>
            {% if body %}<p class="ul-page-explainer__body">{{ body }}</p>{% endif %}
        </div>
        {% if visual_template %}
        <div class="ul-page-explainer__visual" aria-hidden="true">
            {% include visual_template %}
        </div>
        {% endif %}
    </div>
</div>
