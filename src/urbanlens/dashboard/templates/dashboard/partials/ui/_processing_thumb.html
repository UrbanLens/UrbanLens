{% comment %}Stands in for the thumbnail of an upload still being re-encoded; shared/photo-processing.ts draws the same markup. Never an <img>: the stored file is deleted when the re-encode lands.{% endcomment %}
<span class="{{ base_class }}{% if not failed %} media-processing{% endif %}" role="img" aria-label="{% if failed %}This photo couldn't be processed{% else %}Processing…{% endif %}" title="{% if failed %}This photo couldn't be processed{% else %}Processing…{% endif %}"><i class="material-symbols-outlined" aria-hidden="true">{% if failed %}error{% else %}hourglass_top{% endif %}</i></span>
