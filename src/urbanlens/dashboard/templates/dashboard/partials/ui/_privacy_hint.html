{% comment %}Reusable privacy-setting hint icon: near-invisible until hovered/focused, then shows a tooltip naming who can see the data it's placed.{% endcomment %}
{% if field %}
<span class="ul-privacy-hint ul-privacy-hint--editable" role="note" aria-label="Privacy setting"
      data-hint-label="{{ label|default:'' }}" data-hint-note="{{ note|default:'' }}">
    <button type="button" class="ul-privacy-hint-btn"
            title="{% if label %}{{ label }} - {% endif %}Visible to: {{ value }}{% if note %} - {{ note }}{% endif %} - click to change"
            aria-label="Change who can see this - currently visible to: {{ value }}">
        <i class="material-symbols-outlined" aria-hidden="true">{% if raw_value == "anyone" %}visibility{% else %}lock{% endif %}</i>
    </button>
    <select class="ul-privacy-hint-select" hidden aria-label="{{ label|default:'Visibility' }}"
            data-field="{{ field }}" data-url="{% url 'settings.privacy_field' field %}">
        <option value="anyone"{% if raw_value == "anyone" %} selected{% endif %}>Anyone (Logged In)</option>
        <option value="anything_in_common"{% if raw_value == "anything_in_common" %} selected{% endif %}>Users with anything in common</option>
        <option value="common_pin"{% if raw_value == "common_pin" %} selected{% endif %}>Users with a pin in common</option>
        <option value="common_friend"{% if raw_value == "common_friend" %} selected{% endif %}>Users with a friend in common</option>
        <option value="common_trip"{% if raw_value == "common_trip" %} selected{% endif %}>Users with a trip in common</option>
        <option value="friends"{% if raw_value == "friends" %} selected{% endif %}>Friends Only</option>
        <option value="no_one"{% if raw_value == "no_one" %} selected{% endif %}>No one</option>
    </select>
</span>
{% else %}
<span class="ul-privacy-hint"
      data-tooltip="{% if text %}{{ text }}{% else %}{% if label %}{{ label }} - {% endif %}Visible to: {{ value }}{% endif %}{% if note %} - {{ note }}{% endif %}"
      data-tooltip-pos="{{ pos|default:'right' }}"
      tabindex="0"
      role="note"
      aria-label="Privacy setting">
    <i class="material-symbols-outlined" aria-hidden="true">{% if raw_value == "anyone" %}visibility{% else %}lock{% endif %}</i>
</span>
{% endif %}
