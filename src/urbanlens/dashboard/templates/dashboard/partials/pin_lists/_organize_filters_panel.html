{% load vendor_assets %}
{% comment %}Filters tab content, lazy-loaded via HTMX into Organize's "Filters" panel.{% endcomment %}
<div class="pin-lists-toolbar">
    <input type="search" id="saved-filters-search" class="pin-lists-search" placeholder="Search filters..." autocomplete="off">
    <button type="button" class="btn btn--primary btn--lg"
            hx-get="{% url 'saved_filters.new' %}"
            hx-target="#saved-filter-form-dialog" hx-swap="innerHTML"
            data-ul-on-success="saved-filter-open">
        <i class="material-symbols-outlined">add</i>
        New Filter
    </button>
</div>
{# For the dialog's region map. After the toolbar: htmx keeps a response's <body>, and leading <link>/<script> tags parse into <head>. #}
{% vendor_asset "leaflet_css" %}
{% vendor_asset "leaflet_js" %}
{% vendor_asset "maplibregl_css" %}
{% vendor_asset "maplibregl_js" %}
{% vendor_asset "leaflet_draw_css" %}
{% vendor_asset "leaflet_draw_js" %}
<div id="saved-filters-tab-body">
    {% include "dashboard/partials/pin_lists/_filters_tab_grid.html" %}
</div>

{# -- Create/edit saved filter dialog - body is always HTMX-loaded (see New Filter / Edit buttons above and in _filters_tab_grid.html). #}
{# Shared with the pin list detail page - see frontend/ts/shared/saved-filter-form.ts. #}
<dialog id="saved-filter-form-dialog" class="ul-dialog saved-filter-form-dialog" data-success-redirect="{% url 'organize.index' %}?tab=filters" aria-label="Saved filter"></dialog>

{% include "dashboard/partials/pin_lists/_saved_filter_config.html" %}
