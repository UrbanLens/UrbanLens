{% comment %}Wiki-search results for the lightbox's "Send to a wiki" picker.{% endcomment %}
{% for r in results %}
<button type="button" class="photo-wiki-result" data-location-slug="{{ r.object_slug }}" onclick="window._lightboxPickWiki(this)">
    <i class="material-symbols-outlined">public</i>
    <span class="photo-wiki-result-title">{{ r.title }}</span>
    {% if r.subtitle %}<small class="photo-wiki-result-sub">{{ r.subtitle }}</small>{% endif %}
</button>
{% empty %}
{% if query|length >= 2 %}
<p class="photo-wiki-empty">No matching wikis. Try a different name.</p>
{% endif %}
{% endfor %}
