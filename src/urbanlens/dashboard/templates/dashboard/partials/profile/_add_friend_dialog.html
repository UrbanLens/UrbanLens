{% comment %}Shared "Add Friend" dialog, opened by {% include "dashboard/partials/profile/_add_friend_button.html" %}.{% endcomment %}
<dialog id="{{ dialog_id|default:'add-friend-dialog' }}" class="invite-dialog ul-dialog" aria-label="Add a friend">
    <div class="dialog-header">
        <span><i class="material-symbols-outlined">person_add</i> Add Friend</span>
        <button type="button" class="dialog-close" onclick="this.closest('dialog').close()" aria-label="Close dialog">
            <i class="material-symbols-outlined">close</i>
        </button>
    </div>
    <div class="invite-dialog-body">
        <p class="invite-dialog-hint">Optionally include a short note with your friend request.</p>
        <form class="invite-form" method="post" action="{% url 'friend.request' target_profile_id %}"
              {% if hx_target %}hx-post="{% url 'friend.request' target_profile_id %}" hx-target="{{ hx_target }}" hx-swap="outerHTML"{% endif %}
              {% if hx_target %}hx-on::after-request="if(event.detail.successful) this.closest('dialog').close();"{% endif %}>
            {% csrf_token %}
            <textarea name="message" class="invite-email-input invite-message-input" rows="3" maxlength="1000"
                placeholder="Say hello... (optional)"></textarea>
            <div class="invite-form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="material-symbols-outlined">send</i> Send Request
                </button>
            </div>
        </form>
    </div>
</dialog>
