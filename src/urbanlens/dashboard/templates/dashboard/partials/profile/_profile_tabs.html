{% comment %}Profile | Edit | Achievements tab strip for the current user's own profile pages.{% endcomment %}
<nav class="ul-subnav-tabs" aria-label="Profile views">
    <a href="{% url 'profile.view' %}"
       class="ul-subnav-tab {% if active == 'profile' %}is-active{% endif %}"
       {% if active == 'profile' %}aria-current="page"{% endif %}>
        <i class="material-symbols-outlined">person</i>
        <span>Profile</span>
    </a>
    <a href="{% url 'profile.edit' %}"
       class="ul-subnav-tab {% if active == 'edit' %}is-active{% endif %}"
       {% if active == 'edit' %}aria-current="page"{% endif %}>
        <i class="material-symbols-outlined">edit</i>
        <span>Edit</span>
    </a>
    {% if has_achievements %}
    <a href="{% url 'achievement.list' profile_slug=profile_slug %}"
       class="ul-subnav-tab {% if active == 'achievements' %}is-active{% endif %}"
       {% if active == 'achievements' %}aria-current="page"{% endif %}>
        <i class="material-symbols-outlined">trophy</i>
        <span>Achievements</span>
    </a>
    {% endif %}
</nav>
