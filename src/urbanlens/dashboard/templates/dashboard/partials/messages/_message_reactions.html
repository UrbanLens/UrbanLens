{% comment %}Reaction bar for one direct message.{% endcomment %}
<div class="dm-reactions" id="dm-reactions-{{ message.id }}">
  {% for r in reactions %}
  <button type="button" class="dm-reaction-pill{% if my_slug in r.slugs %} dm-reaction-pill--mine{% endif %}"
          hx-post="{% url 'messages.react' partner.slug message.id %}"
          hx-vals='{"emoji": "{{ r.emoji }}"}'
          hx-target="#dm-reactions-{{ message.id }}" hx-swap="outerHTML">
    <span class="dm-reaction-pill__emoji">{{ r.emoji }}</span>
    <span class="dm-reaction-pill__count">{{ r.count }}</span>
  </button>
  {% endfor %}
  <span class="dm-reaction-add-wrap">
    <button type="button" class="dm-reaction-add-btn" title="Add a reaction"
            onclick="var p=this.nextElementSibling; document.querySelectorAll('.dm-emoji-popover').forEach(function(x){ if (x!==p) x.hidden=true; }); p.hidden = !p.hidden;">
      <i class="material-symbols-outlined">add_reaction</i>
    </button>
    <span class="dm-emoji-popover" hidden>
      {% for emoji in reaction_picker_emojis %}
      <button type="button"
              hx-post="{% url 'messages.react' partner.slug message.id %}"
              hx-vals='{"emoji": "{{ emoji }}"}'
              hx-target="#dm-reactions-{{ message.id }}" hx-swap="outerHTML"
              onclick="this.closest('.dm-emoji-popover').hidden = true;">{{ emoji }}</button>
      {% endfor %}
    </span>
  </span>
</div>
