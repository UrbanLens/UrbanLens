{% comment %}Location Data card: an Overview summary plus OpenStreetMap (Nominatim), Photon, Building Characteristics, and Elevation.{% endcomment %}
<div id="location-data-section" class="card card--secondary"
     data-collapse-scope="pin" data-collapse-section="location-data" data-collapse-label="Location Data">
    <div class="card-header">
        <i class="material-symbols-outlined">travel_explore</i>
        <h3>Location Data</h3>
    </div>
    <div class="card-tabs" role="tablist">
        <button type="button" class="pin-plugin-tab-btn card-tab active" role="tab" aria-selected="true"
                hx-get="{% url 'pin.location_data_overview' pin.slug %}"
                hx-target="#location-data-body" hx-swap="innerHTML"
                hx-trigger="load[!(window.ulSectionCollapsed && window.ulSectionCollapsed('pin','location-data'))], click"
                onclick="document.querySelectorAll('#location-data-section .pin-plugin-tab-btn').forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); }); this.classList.add('active'); this.setAttribute('aria-selected', 'true');">
            <i class="material-symbols-outlined">travel_explore</i>
            <span>Overview</span>
        </button>
        <button type="button" class="pin-plugin-tab-btn card-tab" role="tab" aria-selected="false"
                data-panel-key="nominatim"
                hx-get="{% url 'pin.nominatim' pin.slug %}"
                hx-target="#location-data-body" hx-swap="innerHTML"
                onclick="document.querySelectorAll('#location-data-section .pin-plugin-tab-btn').forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); }); this.classList.add('active'); this.setAttribute('aria-selected', 'true');">
            <i class="material-symbols-outlined">map</i>
            <span>Nominatim</span>
        </button>
        {% for tab in location_data_tabs %}
        <button type="button" class="pin-plugin-tab-btn card-tab" role="tab" aria-selected="false"
                data-panel-key="{{ tab.key }}"
                hx-get="{% url 'pin.panel' pin.slug tab.key %}"
                hx-target="#location-data-body" hx-swap="innerHTML"
                onclick="document.querySelectorAll('#location-data-section .pin-plugin-tab-btn').forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); }); this.classList.add('active'); this.setAttribute('aria-selected', 'true');">
            <i class="material-symbols-outlined">{{ tab.icon }}</i>
            <span>{{ tab.label }}</span>
        </button>
        {% endfor %}
    </div>
    <div id="location-data-body" class="card__body pin-plugin-tab-body">
        <p class="pin-plugin-tab-placeholder">Loading...</p>
    </div>
</div>
