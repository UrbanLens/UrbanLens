{# ?album= is carried through so a deep link (or a Back navigation) loads that album directly instead of the list. #}
<div id="albums-panel"{% if oob %} hx-swap-oob="true"{% endif %}
    hx-get="{% url 'pin.albums' pin.slug %}?{% if include_children %}children=1{% endif %}{% if include_children and request.GET.album %}&{% endif %}{% if request.GET.album %}album={{ request.GET.album|urlencode }}{% endif %}{% if request.GET.album_pin %}&album_pin={{ request.GET.album_pin|urlencode }}{% endif %}"
    hx-trigger="intersect once"
    hx-swap="outerHTML"
    class="albums-panel card">
    <div class="card-header">
        <i class="material-symbols-outlined">photo_library</i>
        <span>Photos</span>
    </div>
    <div class="view-loading"><i class="material-icons spin">autorenew</i> Loading...</div>
</div>
