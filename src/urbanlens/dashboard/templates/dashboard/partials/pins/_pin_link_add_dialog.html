{% comment %}Shared add-link dialog, used by both the pin details page's standalone Links card and the wiki page's About card links row.{% endcomment %}
{% include "dashboard/partials/ui/_dialog_header.html" with title="Add Link" %}
<div class="ul-dialog-body">
    <form hx-post="{% url add_url owner_slug %}"
          hx-target="#{{ row_id }}" hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful){this.closest('dialog').close();this.reset();}">
        {% csrf_token %}
        <div class="form-row">
            <label for="pin-link-add-name">Site name</label>
            <input type="text" id="pin-link-add-name" name="name" placeholder="Optional" maxlength="255" autocomplete="off">
        </div>
        <div class="form-row">
            <label for="pin-link-add-url">URL <span class="required">*</span></label>
            <input type="url" id="pin-link-add-url" name="url" placeholder="https://..." required autocomplete="off">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Add Link</button>
            <button type="button" class="btn btn--ghost" onclick="this.closest('dialog').close()">Cancel</button>
        </div>
    </form>
</div>
