{% include "dashboard/partials/ui/_dialog_header.html" with title="Import Photos" %}

<div class="import-photos-tabs" role="tablist" data-card-tabs="is-active">
    <button type="button" data-card-tab class="import-photos-tab is-active" role="tab" aria-selected="true"
            hx-get="{% url 'pin.immich.search' pin.slug %}"
            hx-target="#pin-import-photos-body" hx-swap="innerHTML">
        <i class="material-symbols-outlined">cloud_download</i>
        Immich
    </button>
    <button type="button" data-card-tab class="import-photos-tab" role="tab" aria-selected="false"
            hx-get="{% url 'pin.flickr.search' pin.slug %}"
            hx-target="#pin-import-photos-body" hx-swap="innerHTML">
        <i class="material-symbols-outlined">photo_camera</i>
        Flickr
    </button>
    <button type="button" data-card-tab class="import-photos-tab" role="tab" aria-selected="false"
            hx-get="{% url 'pin.google_photos.start' pin.slug %}"
            hx-target="#pin-import-photos-body" hx-swap="innerHTML">
        <i class="material-symbols-outlined">add_photo_alternate</i>
        Google Photos
    </button>
</div>

<div id="pin-import-photos-body" class="ul-dialog-body">
    <p class="loading-text">Loading...</p>
</div>
