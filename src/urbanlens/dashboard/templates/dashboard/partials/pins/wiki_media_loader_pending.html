{% comment %}Wiki-page counterpart of media_loader_pending.html.{% endcomment %}
<div class="media-provider-loader" id="wiki-media-loader-{{ source }}"
    hx-get="{{ poll_url }}?attempt={{ next_attempt }}"
    hx-trigger="load delay:{{ poll_interval }}s"
    hx-target="#wiki-media-grid"
    hx-swap="beforeend"
    hx-timeout="25000"
    hidden></div>
