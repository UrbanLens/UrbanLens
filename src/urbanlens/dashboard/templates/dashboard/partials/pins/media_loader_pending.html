{% comment %}Self-polling replacement for one media provider's hidden loader div while its background fetch is in flight.{% endcomment %}
<div class="media-provider-loader" id="media-loader-{{ source }}"
    hx-get="{{ poll_url }}?attempt={{ next_attempt }}"
    hx-trigger="load delay:{{ poll_interval }}s"
    hx-target="#media-gallery-grid"
    hx-swap="beforeend"
    hx-timeout="25000"
    hidden></div>
