{% comment %}Property Records card: an Overview summary, then every panel placed here (PanelPlacement.PROPERTY).{% endcomment %}
<div id="property-records-section" class="card card--secondary"
     data-collapse-scope="pin" data-collapse-section="property-records" data-collapse-label="Property Records">
    <div class="card-header">
        <i class="material-symbols-outlined">home_work</i>
        <h3>Property Records</h3>
    </div>
    <div class="card-tabs" role="tablist" data-card-tabs>
        <button type="button" data-card-tab class="pin-plugin-tab-btn card-tab active" role="tab" aria-selected="true"
                hx-get="{% url 'pin.property_records_overview' pin.slug %}"
                hx-target="#property-records-body" hx-swap="innerHTML"
                hx-trigger="ul:lazy-load, click" data-ul-lazy-section="pin:property-records">
            <i class="material-symbols-outlined">home_work</i>
            <span>Overview</span>
        </button>
        {% for tab in property_tabs %}
        <button type="button" data-card-tab class="pin-plugin-tab-btn card-tab" role="tab" aria-selected="false"
                data-panel-key="{{ tab.key }}"
                hx-get="{% url 'pin.panel' pin.slug tab.key %}"
                hx-target="#property-records-body" hx-swap="innerHTML">
            <i class="material-symbols-outlined">{{ tab.icon }}</i>
            <span>{{ tab.label }}</span>
        </button>
        {% endfor %}
    </div>
    <div id="property-records-body" class="card__body pin-plugin-tab-body">
        <p class="pin-plugin-tab-placeholder">Loading...</p>
    </div>
</div>
