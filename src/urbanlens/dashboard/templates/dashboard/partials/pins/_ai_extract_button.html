{% comment %}Sparkle button that submits one external link for AI field extraction.{% endcomment %}
{% if can_ai_extract and pin and url and url not in recently_extracted_urls %}
<button type="button" class="ai-extract-btn"
        hx-post="{% url 'pin.ai_extract' pin.slug %}"
        hx-vals='{"url": "{{ url|escapejs }}"}'
        hx-swap="none"
        title="Read this page with AI and fill in pin details">
    <i class="material-symbols-outlined">auto_awesome</i>
</button>
{% endif %}
