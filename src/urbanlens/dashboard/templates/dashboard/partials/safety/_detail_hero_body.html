{% load humanize %}
{% comment %}Hero body for safety/detail.html.{% endcomment %}
<h1 class="ul-page-hero__title">
    <span class="safety-checkin-status-badge safety-checkin-status-badge--{{ checkin.status }}" id="safety-status-badge">{{ checkin.get_status_display }}</span>
    <span id="safety-title-text">{{ checkin.title }}</span>
</h1>
<p class="ul-page-hero__subtitle" title="{{ checkin.checkin_by|date:'N j, Y g:i A' }}">Check in {{ checkin.checkin_by|naturaltime }}</p>
