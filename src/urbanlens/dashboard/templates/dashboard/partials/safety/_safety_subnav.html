{% comment %}Overview | Settings tab strip for the safety check-in section.{% endcomment %}
<nav class="ul-subnav-tabs" aria-label="Safety check-in views">
    <a href="{% url 'safety.home' %}"
       class="ul-subnav-tab {% if active == 'overview' %}is-active{% endif %}"
       {% if active == 'overview' %}aria-current="page"{% endif %}>
        <i class="material-symbols-outlined">dashboard</i>
        <span>Overview</span>
    </a>
    <a href="{% url 'safety.settings' %}"
       class="ul-subnav-tab {% if active == 'settings' %}is-active{% endif %}"
       {% if active == 'settings' %}aria-current="page"{% endif %}>
        <i class="material-symbols-outlined">settings</i>
        <span>Settings</span>
    </a>
</nav>
