{% comment %}Plays a fade/blur transition on a safety check-in page's content when the check-in gets encrypted and scrubbed while the page is open.{% endcomment %}
<script>
(function () {
    if (window._safetyDissolveInit) return;
    window._safetyDissolveInit = true;
    document.body.addEventListener('safetyCheckinArchived', function () {
        document.querySelectorAll('.safety-page .card').forEach(function (card) {
            card.classList.add('safety-dissolving');
        });
        window._safetySkipLeaveWarning = true;
        setTimeout(function () { window.location.reload(); }, 900);
    });
}());
</script>
