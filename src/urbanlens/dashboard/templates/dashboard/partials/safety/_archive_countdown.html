{% comment %}Live countdown to when a resolved safety check-in will be encrypted and its PII scrubbed.{% endcomment %}
<div class="card safety-archive-countdown" id="safety-archive-countdown" data-archive-at="{{ archive_at|date:'c' }}">
    <i class="material-symbols-outlined">lock_clock</i>
    <span>This check-in's details will be encrypted <span id="safety-archive-countdown-text">soon</span> - anyone who could see it can still leave a final comment until then.</span>
</div>
