{% comment %}Single-month trip calendar grid.{% endcomment %}
<div class="cal-header">
    <button type="button" class="cal-nav-btn" onclick="tripsCalNav(-1)" aria-label="Show previous month">
        <i class="material-icons">chevron_left</i>
    </button>
    <span class="cal-month-label" id="trips-cal-month-label"></span>
    <button type="button" class="cal-nav-btn" onclick="tripsCalNav(1)" aria-label="Show next month">
        <i class="material-icons">chevron_right</i>
    </button>
</div>
<div class="cal-grid" id="trips-cal-grid"></div>
{{ calendar_data|json_script:"trips-cal-data" }}
