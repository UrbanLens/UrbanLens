{% comment %}The message-entry form - shared by the full /assistant/ page and the global overlay dialog.{% endcomment %}
<form class="assistant-input-row"
      hx-post="{% url 'assistant.message' %}"
      hx-vals='js:{page_path: window.location.pathname, dismissals: JSON.stringify(window.ulDismissalRing?.list() || [])}'
      hx-target="#assistant-messages" hx-swap="outerHTML"
      hx-disabled-elt="find button, find input"
      hx-indicator="#assistant-typing"
      hx-on::after-request="if(event.detail.successful){this.reset();var m=document.getElementById('assistant-messages');if(m)m.scrollTop=m.scrollHeight;}">
    {% csrf_token %}
    <input type="text" name="message" maxlength="{{ max_message_chars }}" autocomplete="off"
           placeholder="Find pins, plan a trip..." required>
    <span id="assistant-typing" class="assistant-typing htmx-indicator">thinking&hellip;</span>
    <button type="submit" class="btn btn--primary" aria-label="Send">
        <i class="material-symbols-outlined">send</i>
    </button>
</form>
