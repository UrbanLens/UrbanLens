{% comment %}The first page of the full document gallery grid, server-rendered for a fast first paint.{% endcomment %}
{% for doc in documents %}
<li class="document-tile" id="document-tile-{{ doc.pk }}" data-id="{{ doc.pk }}" data-url="{{ doc.display_url }}"
    data-caption="{{ doc.display_caption|default:'' }}">
    <button type="button" class="document-tile-btn" aria-label="Open document: {{ doc.display_caption|default:'untitled' }}" onclick="documentsOpenLightbox({{ doc.pk }})">
        <i class="material-symbols-outlined document-tile-icon">{{ doc.document_icon }}</i>
        <span class="document-tile-name">{{ doc.display_caption|default:"Untitled document" }}</span>
    </button>
    <button type="button" class="document-tile-del" title="Delete document" onclick="documentsDelete({{ doc.pk }})">
        <i class="material-symbols-outlined">delete</i>
    </button>
</li>
{% endfor %}
