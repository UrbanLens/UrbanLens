{% comment %}Shared "From X" provenance badge for a cloned MarkupMap (one added via "Add to my maps").{% endcomment %}
{% if map.shared_by_id %}
<span class="markup-map-from-badge" title="Added to your maps from a map {{ map.shared_by.username }} shared with you">
    <i class="material-symbols-outlined">forward</i> From {{ map.shared_by.username }}
</span>
{% endif %}
