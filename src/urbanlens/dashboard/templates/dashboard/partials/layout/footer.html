{% comment %}Shared site footer.{% endcomment %}
<footer class="page-footer{% if map_attribution or show_map_footer %} page-footer--map{% endif %}">
    {% if app_version %}
    <span class="page-footer__version" aria-label="Application version">UrbanLens v{{ app_version }}</span>
    {% endif %}
    <div class="page-footer__meta">
        <p class="page-footer__github">
            <i class="material-icons" aria-hidden="true">code</i>
            <span class="page-footer__github-text">This project is open source. Check out our <a href="https://github.com/UrbanLens/UrbanLens">Github page</a>.</span>
        </p>
        <p class="page-footer__attribution" aria-live="polite">
            <span class="page-footer__attribution-text" id="page-footer-attribution-text">{{ map_attribution }}
            <a href="{% url 'thanks' %}" class="page-footer__attribution-more">More info</a>{% if public_costs_page_enabled %} &middot; <a href="{% url 'costs' %}" class="page-footer__attribution-more">Costs</a>{% endif %} &middot; <a href="{% url 'terms' %}" class="page-footer__attribution-more">Terms</a> &middot; <a href="{% url 'privacy' %}" class="page-footer__attribution-more">Privacy</a></span>
        </p>
    </div>
</footer>
