<!doctype html>
<html><head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- The site's own compiled stylesheet, so layout questions can be asked here
     at all: without it every class in the markup is inert. -->
<link rel="stylesheet" href="/dashboard/style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<style>
/* The site's own stylesheet lays this page out, and nothing here overrides it.
   It used to: the map was pinned to 900x640 and the sidebar taken out of flow,
   which meant a test asking where anything sat got this block's answer instead
   of _floorplans.scss's. Both turned out to be workarounds for the map element
   missing its own class, so the height rule never applied. Keep it that way -
   a rule added here is a rule the site does not have. */
html,body{margin:0}
</style>
</head><body>
<div id="floorplan-origin-banner" hidden></div>
<div class="floorplan-editor"><div class="floorplan-editor__stage"><div class="floorplan-map-shell">
  <div class="floorplan-toolbar-stack">
  <div id="floorplan-tools" class="map-buttons"><div class="map-buttons-content">
    <button class="map-btn-icon is-active" data-tool="select" aria-label="Select (V)" data-tooltip="Select (V)"></button>
    <button class="map-btn-icon" data-tool="box" aria-label="Box select (B)" data-tooltip="Box select (B)"></button>
    <button class="map-btn-icon" data-tool="rotate" aria-label="Turn (T)" data-tooltip="Turn (T)"></button>
    <button class="map-btn-icon" data-tool="wall" aria-label="Wall (W)" data-tooltip="Wall (W)"></button>
    <button class="map-btn-icon" data-tool="opening" aria-label="Opening (D)" data-tooltip="Opening (D)"></button>
    <button class="map-btn-icon" data-tool="room" aria-label="Room (R)" data-tooltip="Room (R)"></button>
    <button class="map-btn-icon" data-tool="marker" aria-label="Marker (M)" data-tooltip="Marker (M)"></button>
    <button class="map-btn-icon" id="floorplan-copy-floor" aria-label="Copy this floor to a new one" data-tooltip="Copy this floor to a new one"></button>
  </div></div>
  <div id="floorplan-tool-options" class="map-buttons floorplan-tool-options" hidden>
    <button class="map-toolbar-collapse" aria-label="Toggle tool options"><i class="material-symbols-outlined">chevron_right</i></button>
    <div id="floorplan-tool-options-content" class="map-buttons-content"></div>
  </div>
  </div>
  <div id="floorplan-map" class="floorplan-map" tabindex="0" role="application" aria-label="Floorplan canvas. Tab and Shift+Tab move between walls, openings, rooms and markers; arrow keys nudge what is selected; Escape leaves."
       data-json-url="/json" data-save-url="/save" data-publish-url="/publish"
       data-lat="41.733" data-lng="-73.928"></div>
  <div class="floorplan-canvas-controls">
    <button id="floorplan-delete" aria-label="Delete selection" data-tooltip="Delete (Del)" hidden></button>
  </div>
  <div id="floorplan-floors-panel" class="map-buttons floorplan-canvas-floors">
    <button class="map-toolbar-collapse" aria-label="Toggle floor list"><i class="material-symbols-outlined">chevron_right</i></button>
    <div id="floorplan-floors" class="map-buttons-content floorplan-floors"></div>
  </div>
  <div class="map-bottom-controls"><div id="floorplan-layers"></div></div>
  <div id="floorplan-empty"><button id="floorplan-start-outline"></button><button id="floorplan-start-rectangle"></button></div>
  <div id="floorplan-unavailable" hidden><button id="floorplan-retry-load"></button></div>
</div><p id="floorplan-hint"></p><p id="floorplan-live"></p></div>
<aside class="floorplan-sidebar">
  <span id="floorplan-save-status"></span>
  <button id="floorplan-retry-save" hidden></button>
  <button id="floorplan-reload" hidden></button>
  <button id="floorplan-more-toggle"></button><div id="floorplan-more-list" hidden>
    <button id="floorplan-save-version"></button><button id="floorplan-publish"></button></div>
  <div id="floorplan-floor-fields"></div>
  <div id="floorplan-form"></div>
  <div id="floorplan-marker-appearance" hidden>
    <input type="hidden" id="icon-value-floorplan-marker">
    <div class="color-picker" id="color-picker-floorplan-marker">
      <input type="hidden" id="color-value-floorplan-marker" value="">
      <button type="button" class="color-swatch" data-color="#e53935" style="background-color:#e53935" aria-label="Red"
              onclick="pickColor('color-picker-floorplan-marker','color-value-floorplan-marker','#e53935',this)"></button>
      <button type="button" class="color-swatch color-clear selected" data-color="" aria-label="No color"
              onclick="pickColor('color-picker-floorplan-marker','color-value-floorplan-marker','',this)"><i class="material-symbols-outlined">block</i></button>
    </div>
  </div>
  <details class="floorplan-details-accordion">
    <summary>Add more details</summary>
    <div id="floorplan-floor-advanced-fields"></div>
    <input id="floorplan-name"><input id="floorplan-valid-from" type="date">
    <div id="floorplan-versions" hidden></div>
  </details>
</aside></div>
<script id="floorplan-outline" type="application/json">[]</script>
<script id="floorplan-overlays" type="application/json">[]</script>
<script id="floorplan-labels" type="application/json">[]</script>
<script id="floorplan-photos" type="application/json">[{"uuid":"img-1","url":"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7","caption":"South elevation"},{"uuid":"img-2","url":"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7","caption":"Boiler room door"}]</script>
<script type="module" src="/dashboard/js/floorplan-editor.js"></script>
</body></html>
