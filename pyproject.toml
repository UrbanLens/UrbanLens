name = "UrbanLens"
version = "0.9.0"
description = "Mapping for Urban Explorers"
readme = "README.md"
authors = [{ name = "Jess Mann", email = "jess@urbanlens.com" }]
requires-python = ">=3.12"
dependencies = [
    "celery~=5.6.3",
    "channels~=4.3.2",
    "channels-redis~=4.3.0",
    "cryptography>=49.0,<50.1",
    "daphne~=4.2.2",
    "dateparser~=1.4.1",
    "django>=6.0.6,<6.2.0",
    "django-auto-prefetch~=1.14.0",
    "django-cors-headers~=4.9.0",
    "django-csp~=4.0",
    "django-dirtyfields~=1.9.9",
    "django-pandas~=0.6.7",
    "django-picklefield~=3.4.0",
    "django-postgres-extra~=2.0.4",
    "django-prometheus~=2.5.0",
    "djangofoundry~=0.0.10",
    "djangorestframework>=3.17.1,<3.19.0",
    "fastkml~=1.4.0",
    "geopandas~=1.2.0",
    "geopy>=2.4.1,<2.6.0",
    "gpxpy~=1.6.2",
    "gunicorn>=26.0,<26.3",
    "humanize>=4.15,<4.17",
    "jinja2~=3.1.6",
    "linkify-it-py>=2.1,<2.3",
    "lxml~=6.1.1",
    "markdown-it-py~=4.2.0",
    "mdit-py-plugins~=0.6.1",
    "defusedxml~=0.7.1",
    "nh3~=0.3.5",
    "openai>=3.29,<4",
    "orjson>=3.13.0,<3.14.0",
    "pandas~=3.0.3",
    "pdf2image~=1.17.0",
    "pgvector~=0.5.0",
    "pillow>=12.2,<12.4",
    "pillow-heif>=0.18",
    "pydantic~=2.14.1",
    "pydantic-settings>=2.14.1,<2.16.0",
    "pypdf>=6.20,<6.21",
    "pytesseract~=0.3.13",
    "python-dateutil~=2.9.0",
    "python-docx~=1.2.0",
    "python-dotenv~=1.2.2",
    "pyotp~=2.10.0",
    "pyyaml~=6.0.3",
    "qrcode~=8.2",
    "redis>=8.0,<8.2",
    "requests~=2.34.2",
    "requests-oauthlib~=2.0.0",
    "rich~=15.0.0",
    "s2sphere~=0.2.5",
    "shapely~=2.2.0",
    "simplejson~=4.2.0",
    "social-auth-app-django>=7.1,<8",
    "sqlalchemy~=2.1.4",
    "stripe~=16.0.0",
    "tiktoken>=0.13,<0.15",
    "typing-extensions>=4.15,<4.17",
    "webauthn~=3.0.0",
    "whitenoise~=6.12.0",
    "overturemaps>=1.0.1",
    "filetype~=1.2.0",
    "clamd~=1.0.2",
    "drf-spectacular>=0.30.0",
    "django-oauth-toolkit>=3.3.0",
    "anthropic>=1.13,<2",
    "django-storages[s3]~=1.14",
    "jinjax~=0.66",
    "psycopg[binary,pool]>=3.3,<3.4",
