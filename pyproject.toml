[project]
name = "UrbanLens"
version = "0.8.0b0"
description = "Mapping for Urban Explorers"
readme = "README.md"
authors = [{ name = "Jess Mann", email = "jess@urbanlens.com" }]
requires-python = ">=3.12"
dependencies = [
    "celery~=5.6.3",
    "channels~=4.3.2",
    "channels-redis~=4.3.0",
    "cryptography~=49.0.0",
    "daphne~=4.2.2",
    "dateparser~=1.4.1",
    "django~=6.0.6",
    "django-auto-prefetch~=1.14.0",
    "django-cors-headers~=4.9.0",
    "django-csp~=4.0",
    "django-dirtyfields~=1.9.9",
    "django-pandas~=0.6.7",
    "django-picklefield~=3.4.0",
    "django-postgres-extra~=2.0.4",
    "django-prometheus~=2.5.0",
    "djangofoundry~=0.0.10",
    "djangorestframework~=3.17.1",
    "fastkml~=1.4.0",
    "geopandas~=1.1.3",
    "geopy>=2.4.1,<2.6.0",
    "gevent>=26.5,<26.8",
    "gpxpy~=1.6.2",
    "gunicorn~=26.0.0",
    "humanize>=4.15,<4.17",
    "jinja2~=3.1.6",
    "linkify-it-py~=2.1.0",
    "lxml~=6.1.1",
    "markdown-it-py~=4.2.0",
    "mdit-py-plugins~=0.6.1",
    "defusedxml~=0.7.1",
    "nh3~=0.3.5",
    "openai>=2.43,<2.49",
    "orjson~=3.11.9",
    "pandas~=3.0.3",
    "pdf2image~=1.17.0",
    "pillow>=12.2,<12.4",
    # HEIC/HEIF decoding for Pillow. Not optional: heic/heif are accepted
    # uploads (the iPhone default), and without this Pillow cannot open them at
    # all - so a GPS strip a user asked for failed silently and the file was
    # stored with its coordinates intact. See dashboard.apps for where the
    # opener is registered.
    "pillow-heif>=0.18",
    "psycogreen~=1.0.2",
    "psycopg2-binary~=2.9.12",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.14.1",
    "pypdf>=6.2,<6.15",
    "pytesseract~=0.3.13",
    "python-dateutil~=2.9.0",
    "python-docx~=1.2.0",
    "python-dotenv~=1.2.2",
    "pyotp~=2.10.0",
    "pyyaml~=6.0.3",
    "qrcode~=8.2",
    "redis~=8.0.0",
    "requests~=2.34.2",
    "requests-oauthlib~=2.0.0",
    "rich~=15.0.0",
    "s2sphere~=0.2.5",
    "shapely~=2.1.2",
    "simplejson~=4.1.1",
    "social-auth-app-django>=5.9,<6.1",
    "sqlalchemy~=2.0.51",
    "stripe~=15.3.0",
    "tiktoken~=0.13.0",
    "typing-extensions>=4.15,<4.17",
    "webauthn~=3.0.0",
    "whitenoise~=6.12.0",
    "overturemaps>=1.0.1",
    "filetype~=1.2.0",
    "clamd~=1.0.2",
    "drf-spectacular>=0.30.0",
    "django-oauth-toolkit>=3.3.0",
    "anthropic>=0.120,<0.130",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanlens", "src/urbanlens_ai"]

[tool.ruff]
# Basic configuration options
line-length = 250

target-version = "py312"
respect-gitignore = true
include = ["**/*.py", "**/*.pyi"]
exclude = [
    "node_modules/",
    ".venv/",
    ".venv_windows/",
    ".direnv/",
    ".env",
    "manage.py",
    ".vscode",
    "pgsql",
    "migrations/",
    "logs/",
    "__pycache__",
]
# Advanced configuration options
# These are bare path components, so they match at any depth.
# `tests` and `__init__.py` used to be here. They are linted now, under the
# narrowed rule sets in [tool.ruff.lint.per-file-ignores] below. Excluding them
# outright hid 1,077 files - 51% of the tree - from every rule, including import
# order and dead noqa. (Measured as the difference in `ruff check --show-files .`
# with and without those two entries: 2,030 files vs 953.)
extend-exclude = [
    "migrations",
    "settings",
    "logs",
    "node_modules",
    "__pycache__",
    # One-off benchmark and analysis scripts kept beside the reports they
    # produced. They are records, not importable code, so the package rules
    # (INP001 in particular) do not apply to them.
    "docs/reports",
]
#max-complexity = 10
output-format = 'concise'

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# "select = ['ALL']" turns on essentially everything Ruff knows about.
# Expect to ignore a handful that conflict with your style or are too noisy.
select = ["ALL"]

# Turn on preview rules (newer checks; can be a bit more volatile)
#preview = true

ignore = [
    # Keep these off
    "TRY300",  # Consider moving to else -- this discourages final unindented returns for future proofing
    "ARG002",  # unused method argument: `kwargs`
    "E501",    # Line too long
    "COM812",  # Recommended to turn off by pre-commit ruff hook
    "FIX002",  # TODOs
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link for this TODO
    "TD004",   # Missing colon in TODO
    "ERA001",  # Found commented out code
    "UP040",   # Using type alias instead of type keyword
    "PLR6301", # Method could be a function, class method, or static
    "DJ001",   # Avoid null=True on CharField
    "PT009",   # Use a regular assert instead of unittest-style assertEqual
    "EM101",   # Exception must not use a string literal, assign to variable first
    "EM102",   # Exception must not use an f-string literal, assign to variable first
    "PLR0904", # too-many-public-methods
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR1702", # too many nested blocks
    "D2",      # One-line docstring..., 1 blank line, etc
    "D400",    # first line should...
    "D401",    # first line should...
    "D415",    # first line should...
    "D421",    # Docstring should not begin with verb
    "CPY001",  # Missing copyright notice at top of file
    "DOC502",  # This discourages reporting raises from ancestors
    "SIM108",  # Use ternary operator insead of if-else
    "TRY003",  # Avoid specifying long messages outside the exception class
    "F401",    # unused imports. Enabling this will remove TYPE_CHECKING imports incorrectly.
    "W293",    # blank line contains whitespace
    "W391",    # blank line at end of file
    "DJ012",   # Order of model's inner classes, methods... does not follow Django style guide
    "RUF001",  # Ambiguous heavy plus sign (emoji)
    # Ambivalent about turning these on/off
    "C901",   # function is too complex
    "ARG001", # unused argument
    # Fix issues and turn these on
    "PERF401", # Use list comprehension
    "PLR0916", # too-many-boolean-expressions
    "D417",    # Missing argument descriptions in docstring for args, kwargs
    "D1",      # Missing docstring...
    "S404",    # subprocess module is potentially insecure
    "S603",    # subprocess Call: check for execution of untrusted input
    "UP022",   # Prefer capture_output over stdout and stderr -> PIPE
    "PLR2004", # magic values in tests
    "ANN",     # type annotation enforcement
    "DOC",     # docstring rules
    "PLC0415", # import should be at top
    "BLE001",  # catch blind Exception
    "PLW1641", # implement __hash__
    "SIM102",  # nested
    "TRY401",  # redundant exception object
    "RUF012",  # mutable class attributes -> ClassVar
    "FBT001",  # boolean position argument
    "FBT002",  # boolean default argument
    "PYI021",  # docstrings should not be included in pyi (I'm not sure this is true??)
    "PTH",     # use Pathlib
    "N806",    # variable should be lowercase
]

# Reported, never auto-fixed. RUF100's fix deletes the whole trailing comment,
# so `# noqa: S301 - round-tripping our own value` loses the explanation as well
# as the directive. A stale suppression is worth knowing about; silently
# discarding the sentence that says why it was there is not.
unfixable = ["RUF100"]

[tool.ruff.lint.per-file-ignores]
# Test code is linted, but only for mechanical hygiene - import order, quote
# style, dead noqa, modernisation. A test is allowed to pass a wrong type on
# purpose, reach into a private, hardcode a fake password and assert on a naive
# datetime; a linter that argues about any of that is a linter people turn off.
#
# The previous `"test_*.py"` key never fired the way CI invokes ruff, because
# `extend-exclude` dropped the directories first, and it missed every helper not
# named test_*.py (strategies.py, place_helpers.py, testcase.py, result.py).
# The brace alternation below covers all three test locations:
#   src/urbanlens/dashboard/tests/**  (894 files)  src/urbanlens/core/tests/**  (17)
#   tests/contract/**  (3)                         src/urbanlens/conftest.py
"**/{tests/**,test_*.py,conftest.py}" = [
    # --- pytest/unittest idiom. The suite is unittest-style by choice; PT009
    # (assertEqual) is already globally ignored for exactly this reason.
    "PT027",   # unittest-style assertRaises - 386 sites, i.e. a whole-suite rewrite
    "PT019",   # false positive: these are @mock.patch args, not fixtures
    "PT018",   # splitting a two-clause assert adds lines, not information
    "PT011",   # forces match= on pytest.raises, i.e. asserting on message strings
    # --- fixtures and fakes
    "S",       # bandit: assert (651), fake passwords (61), /tmp paths, SQL literals
    "SLF001",  # reaching into privates is how you test internals
    "DTZ",     # hypothesis st.datetimes() REQUIRES naive min/max, and a fixture date
               # needs no zone; DTZ001/007/011 all fire on ordinary test setup
    "FBT003",  # wrong on assertIs(x, True), where the bool is the expected value
    "ARG005",  # lambda signature is dictated by the callee being mocked
    "PLW0603", # a module-level counter handing fixtures unique coordinates is normal
    "B017",    # crypto interop tests where "it fails somehow" IS the assertion
    # --- structure
    "TC",      # TYPE_CHECKING blocks: churn with runtime-breakage risk
    "D",       # docstrings deliberately open with the identifier under test
    "INP001",  # tests/contract/ has no __init__.py by design (pytest rootdir layout)
    "N802",    # getDescription overrides unittest.TextTestResult - stdlib API casing
    "E402",    # sys.path adjustment before imports
    "PLC0414", # `import X as X` re-export
    "PGH003",  # blanket type: ignore
    # --- nothing here deletes code. A binding kept for a future assertion and a
    # noqa comment explaining why something is suppressed are both information.
    "RUF100",  # would delete a stale noqa AND the trailing comment explaining it
    "RUF059",  # unused tuple slots document what a setup helper returns
    "RET504",  # a named intermediate before return documents the value
    "B007",    # unused loop variables name what is being iterated
    # --- already global; repeated so the scope stays correct if that changes
    "ANN",     # type annotation enforcement
    "PLR09",   # too-many-...
    "PLR2004", # magic values
]
# An __init__.py is a re-export surface. Unused imports (F401) are already
# globally ignored, which covers the plain `import X` half of that; these cover
# the rest. Import ORDER is deliberately still checked - it was verified safe by
# applying the fixes and running `manage.py check` in the app container.
"**/__init__.py" = [
    "F403",    # `from .x import *` - prospective re-export
    "F405",    # a name possibly from a star import
    "RUF100",  # a noqa here often documents a deliberate side-effect import
    "TC001",   # moving a name into TYPE_CHECKING removes it from the re-export surface
]
"**/bin/**/*.py" = [
    # Fix issues and turn back on
    "E402", # module level import not at top of file - allow adjusting path for scripts
    "ANN",  # type annotation enforcement
    "T201", # these are CLI scripts; printing is the point
    "S607", # they invoke `git`/`docker` through PATH, which is the point of a dev script
]
# Claude Code hook scripts: stdlib-only CLI entry points invoked by the harness.
".claude/**/*.py" = [
    "T201",    # they report to the agent on stdout
    "INP001",  # not a package
]

[tool.ruff.lint.isort]
known-first-party = ["urbanlens"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
# Dev-only additions on top of [project.dependencies] - `uv sync` installs both by default.
dev = [
    "bandit>=1.8.6,<1.10.0",
    "codespell>=2.4.3",
    "coverage>=7.14.1,<7.16.0",
    # Coverage of the lines a branch actually changed, rather than a whole-tree
    # percentage that moves too slowly to mean anything on any one commit.
    "diff-cover~=10.5.1",
    "django-debug-toolbar~=7.0.0",
    # Records each covered view's query *fingerprint* to a checked-in .perf.yml,
    # so an N+1 arrives as a reviewable diff. Chosen over a runtime detector
    # (`nplusone`) because that one has not shipped since 2019, and because
    # `django-auto-prefetch` already suppresses the access pattern such a
    # detector watches for - which would make it quiet precisely where this
    # codebase's N+1s actually came from. See core/tests/query_scaling.py.
    "django-perf-rec~=4.31.0",
    "django-stubs~=6.0.5",
    "django-stubs-ext~=6.0.5",
    "faker>=40.23,<40.37",
    "hypothesis[django]>=6.155.5,<6.162.0",
    "icecream~=2.2.0",
    "kombu~=5.6.2",
    "libcst~=1.8.6",
    "model-bakery>=1.23.5,<1.25.0",
    "mutmut~=3.7.0",
    "mypy~=2.1.0",
    "myst-parser~=5.1.0",
    "pre-commit~=4.6.0",
    # Server-side interop tests for the direct-message E2EE blob formats -
    # verifies the documented Argon2id/secretbox/sealed-box layouts round-trip
    # against the browser's libsodium implementation (see docs/designs/e2ee.md).
    "pynacl~=1.6.2",
    "pytest>=9.1.1",
    "pytest-django~=4.12.0",
    # Installed but disabled in `addopts`; `bin/run_tests.sh --shuffle` enables it.
    "pytest-randomly~=4.1.0",
    # Parallel test workers. Off by default: each worker takes its own database,
    # so the multiplier applies to database *setup* as well, and the local
    # Postgres has been observed to fall over under exactly this load. Use it in
    # the container, via `bin/run_tests.sh --parallel`.
    "pytest-xdist~=3.8.0",
    "ruff>=0.15.20,<0.17.0",
    # Property-based conformance testing against the published OpenAPI document.
    # The schema is a deployed artefact with generated clients depending on it,
    # and nothing else checks that a response matches what it advertises.
    # Drives tests/contract/; see docs/CONTRACT_TESTS.md.
    "schemathesis~=4.25.1",
    "setuptools>=82.0.1,<83.1.0",
    "sphinx~=9.1.0",
    "sphinx-autoapi~=3.8.1",
    "sphinx-rtd-theme~=3.1.0",
    "tqdm>=4.68.3,<4.70.0",
    "types-requests~=2.33.0.20260518",
    "types-requests-oauthlib~=2.0.0.20260610",
    "uv~=0.11.22",
    "vulture>=2.16",
]
#max-complexity = 10
#show-source = true

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = false
warn_unused_ignores = true
show_error_context = true
show_column_numbers = true
show_error_code_links = true
pretty = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
# These are unanchored REGEXES, not globs, so a literal dot has to be escaped.
# `.github/` matched any path containing <anychar>github/, which silently
# excluded services/apis/infra/github/ - production code that had therefore
# never been type-checked at all.
# `/__init__.py` used to be here too; those files hold ~123 real statements and
# checking them costs zero errors.
exclude = [
    "migrations/",
    "tests/",
    "test_.*\\.py",
    "\\.venv/",
    "\\.venv_windows/",
    "site-packages/",
    "pgsql/",
    "docs/",
    "downloads/",
    "\\.github/",
    # Dead legacy scaffolding: nothing references it, and it cannot import -
    # `Settings.get_logger` at module scope reads `src/bin/conf/settings.yaml`,
    # a directory that does not exist. `check_untyped_defs` reports two real
    # defects in its `main()` (an Enum subclassed after it had members, and
    # `Settings(...)` called with an argument it does not take), neither of
    # which can be verified by running the file. Recorded as P73 rather than
    # fixed blind. `src/bin/db.py` next to it IS live (`bun run db`) and stays
    # checked.
    "src/bin/app\\.py",
]
# Off, i.e. mypy's own default: `def f(x: int = None)` should not type-check.
# Measured at zero new errors, so this only guards future code.
implicit_optional = false
# Each measured at zero new errors on the current tree:
#   strict_equality       - catches always-False comparisons (enum vs raw string)
#   warn_redundant_casts  - enforces the "never use cast" rule mechanically
# check_untyped_defs costs 2, and is the answer to the `annotation-unchecked`
# notes: it actually checks those bodies instead of just naming them.
strict_equality = true
warn_redundant_casts = true
check_untyped_defs = true
# 'misc' stays off: 80% of what it reports is one django-stubs artifact,
# `Unsupported dynamic base class` for the Manager.from_queryset() pattern,
# across 68 files under dashboard/models/.
# 'override' is now ON - it found a Liskov violation and a too-narrow base
# return type, at a cost of 12 errors in 6 files.
disable_error_code = ['misc', 'annotation-unchecked']

# `override` is on globally because it found real defects. These four modules
# are the exceptions, and each is a documented django-stubs limitation rather
# than a Liskov violation worth fixing:
#
#   models/fields.py            TYPE_CHECKING-only __get__/__set__ that exist
#                               precisely to override the stub-derived attribute
#                               type - the storage type is text, the Python type
#                               is a JSON value.
#   models/abstract/versioned.py  bulk_create/bulk_update widen `objs` to
#                               Sequence[Any] because the queryset is generic
#                               over models the stubs bind to a single _Model.
#   models/wiki/queryset.py     as_manager() is synthesised per QuerySet class by
#                               the stubs, so ANY multiple-inheritance QuerySet
#                               reports an incompatible return type.
#   services/photos/photo_enrichment.py
#                               one source resolves service_keys at runtime, so
#                               it is a property where its siblings are ClassVar.
[[tool.mypy.overrides]]
module = [
    "urbanlens.dashboard.models.fields",
    "urbanlens.dashboard.models.abstract.versioned",
    "urbanlens.dashboard.models.wiki.queryset",
    "urbanlens.dashboard.services.photos.photo_enrichment",
]
disable_error_code = ["override"]

[tool.django-stubs]
django_settings_module = "urbanlens.UrbanLens.settings.test"
ignore_missing_model_attributes = true
#strict_settings = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "urbanlens.UrbanLens.settings.test"
# tests/contract is on the path so that suite's conftest and test modules can
# share `schema_source` by plain import. It holds no `test_*` modules of its own
# and is not in `testpaths`, so this affects imports only, never collection.
pythonpath = ["src", "tests/contract"]
# `tests/` is deliberately outside this. The Playwright suite under
# tests/integration/ is not Python, and tests/contract/ needs either a running
# deployment or an explicit opt-in to fuzzing, so neither belongs in the run
# that a pre-commit hook or a plain `pytest` performs.
testpaths = ["src/urbanlens"]
# -p no:randomly: pytest-randomly is installed but off unless asked for.
# Shuffling was probed across three seeds on a subset and found no order
# dependence, which is not the same as knowing all ~11,000 tests are
# order-independent - and a plugin that reorders every run by default turns
# that unknown into intermittent failures for everyone. `bin/run_tests.sh
# --shuffle` turns it on deliberately.
addopts = "--import-mode=importlib -p no:randomly"
markers = [
    "contract: OpenAPI conformance checks (tests/contract). Needs --contract-* options; not collected by default.",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "urbanlens/manage.py",
    "*/settings/*",
    "*/asgi.py",
    "*/wsgi.py",
    ".venv/*",
    ".venv_windows/*",
    "*/site-packages/*",
    "pgsql/*",
    "docs/*",
    "downloads/*",
    ".github/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["*/tests/*", "*/test_*.py"]

# Mutation testing. Deliberately scoped rather than whole-tree: a mutant costs a
# test run, so this is aimed at the modules where a silent test would be most
# expensive - money, privacy, and the community-editable wiki.
#
# `pytest_add_cli_args` carries --reuse-db because building a test database costs
# about three minutes against 3.5 seconds of actual tests; without it a few dozen
# mutants would take hours. Run bin/run_mutation_tests.sh, which sets that up.
[tool.mutmut]
source_paths = ["src/urbanlens"]
only_mutate = [
    "src/urbanlens/dashboard/services/billing/banking.py",
    "src/urbanlens/dashboard/services/profile/identity_visibility.py",
    "src/urbanlens/dashboard/services/wiki/wiki_edits.py",
]
do_not_mutate = ["*/tests/*", "*/migrations/*"]
# mutmut runs the suite in a copy of the tree at `mutants/`, which does not
# contain the collected static files - and any test that renders a full page
# fails on a missing staticfiles manifest entry without them.
also_copy = ["src/urbanlens/frontend/static"]
pytest_add_cli_args = ["--reuse-db", "-q"]
# Scope both phases to the tests that actually cover the mutated modules.
# Without this, mutmut's stats-collection phase runs all 11,000 tests, which
# takes over an hour before the first mutant is even tried.
pytest_add_cli_args_test_selection = [
    "src/urbanlens/dashboard/tests/hypothesis/test_billing_banking.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_billing_ledger_concurrency.py",
    # test_identity_visibility_batch.py does NOT cover this module - it tests
    # Profile.visible_profile_pks/Friendship batching and never imports
    # services.profile.identity_visibility. Its presence here (instead of the
    # files that actually do) is why every one of this module's ~105 mutants
    # reported "no tests" rather than a real killed/survived verdict - fixed
    # 2026-08-22, see docs/PROBLEMS.md.
    "src/urbanlens/dashboard/tests/hypothesis/test_identity_visibility.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_dm_share_live_updates.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_map_pin_share_detection_integration.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_query_scaling_group_members.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_wiki_edit_field_scope.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_wiki_revert_of_revert.py",
    "src/urbanlens/dashboard/tests/hypothesis/test_wiki_boundary_revert.py",
]
# test_wiki_edits_service.py is excluded on purpose: its Hypothesis property
# tests trip HealthCheck.differing_executors under mutmut's runner, which is an
# artefact of the harness rather than a finding about the code.

# ---------------------------------------------------------------------------
# vulture -- dead code. Advisory only: it cannot see CLI entry points or
# functions referenced from HTML/templates, so read its output, don't obey it.
# ---------------------------------------------------------------------------
[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
