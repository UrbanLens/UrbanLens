name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: urbanlens.UrbanLens.settings.test
  DJANGO_SECRET_KEY: ci-insecure-secret-key
  UL_DB_NAME: urbanlens_ci
  UL_DB_USER: postgres
  UL_DB_PASS: postgres
  UL_DB_HOST: localhost
  UL_DB_PORT: "5432"
  UL_VALKEY_URL: redis://localhost:6379/0
  UL_UNSAFE_ALLOW_HTTP: "True"
  UL_ENVIRONMENT: testing

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: urbanlens_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urbanlens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev postgresql-client

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check src

      - name: Ruff format check
        run: ruff format --check src

      - name: Static type check
        # --show-traceback: the django-stubs plugin runs django.setup() while it
        # constructs, and mypy reports any failure there as a bare "Error
        # constructing plugin instance" with nothing to act on.
        run: mypy src --show-traceback

      # Structural, and cheap: every urbanlens.* import in a committed file must
      # resolve to a file git actually has. Runs in pre-commit too, but that only
      # protects a developer who has it installed and does not pass --no-verify -
      # and the incident it was written for (a commit that landed 139 files while
      # leaving five imported modules untracked) broke model loading for the app,
      # every management command, both workers and the whole suite.
      - name: Imports resolve in the committed tree
        run: python3 bin/check_imports_tracked.py

      # A citation like `controllers/friendship.py:649` in a 583-line file sends
      # a reader to nothing, and nothing else notices: the file still exists and
      # the note still reads as authoritative. Only the unambiguous half is
      # enforced - that the line exists - since "the line moved" needs a human.
      - name: Documentation citations point at real lines
        run: python3 bin/check_doc_line_refs.py

      # makemigrations builds `dependencies` from whatever files are on disk,
      # tracked or not - so an uncommitted migration can become the parent of a
      # committed one. Invisible in the checkout that made it; NodeNotFoundError
      # everywhere else, before the app or the workers can start.
      - name: Migration graph resolves in the committed tree
        run: python3 bin/check_migration_graph.py

      # A pre-commit-only check is defeated by --no-verify, no hooks installed,
      # or a hookless path like the GitHub web UI - exactly the "worked around,
      # not fixed" friction docs/GOALS.md calls out. imports-tracked/doc-line-refs/
      # migration-graph above already made this move; these two were the last
      # structural pre-commit hooks still missing a CI backstop.
      - name: No swallowed-failure result gets cached as a success
        run: python3 bin/check_outage_not_cached.py

      - name: Every notification write honours the mute preference
        run: python3 bin/check_notification_choke_point.py

      # Field provenance is recorded by interception, so a model that declares
      # versioned_fields without a VersionedQuerySet records instance saves and
      # silently drops every bulk write - which reads as working.
      - name: Versioned models intercept every write path
        run: python3 bin/check_versioned_writes.py

      # A transition made by queryset update() emits no signal, so a post_save
      # subscription waiting on it is dead and looks alive. Three rules in the
      # reputation ledger shipped that way.
      - name: Signal subscriptions are reachable
        run: python3 bin/check_signal_reachable.py

      # resolve_visible_wiki may return a concealed projection, and saving one
      # writes a single viewer's redacted view over the community's content.
      - name: A wiki resolved for reading is never saved
        run: python3 bin/check_concealed_writes.py

      # {# #} is Django's single-line comment. An opener that does not meet #}
      # on the same line is emitted as text, so the visitor sees it. The
      # supported multi-line form is {% comment %}.
      - name: Template hash-comments close on the line they open
        run: python3 bin/check_template_comments.py

      # The three below had no CI backstop before 2026-09-04. Two ran only in
      # pre-commit (defeated by --no-verify or by a checkout where nobody ran
      # `pre-commit install`), and check_pin_not_published_to_wiki.py - a
      # privacy guard - was wired into nothing at all.
      - name: Tracked text files are stored with LF
        run: python3 bin/check_line_endings.py

      - name: A private pin's fields never reach a community wiki
        run: python3 bin/check_pin_not_published_to_wiki.py

      # A document that moves leaves its pointers behind: a 2026-09-04 sweep
      # found 39 stale citations across 33 files, including one naming a file
      # that had been deleted from git without its replacement being added.
      - name: Code cites only docs/ paths that exist
        run: python3 bin/check_docs_refs.py

      # The index is the allocator (docs/README.md), and CLAUDE.md sends every
      # session to it first. The first generated index gave P1 to both a problem
      # entry and a design document, and nothing noticed.
      - name: docs/INDEX.md agrees with the entries it indexes
        run: python3 bin/check_docs_index.py

      # Nothing else checks this: a model change without its migration only
      # surfaces if some test happens to touch the field, and otherwise waits
      # until the column is needed in production.
      - name: No missing migrations
        run: python src/urbanlens/manage.py makemigrations --check --dry-run

      # ----------------------------------------------------------------------------
      # Deployment checks, still disabled - but not for the three reasons that used
      # to be listed here. Re-checked 2026-08-17:
      #
      #   - SECURE_HSTS_SECONDS is now set (settings/base.py), so W004 no longer
      #     reflects a missing setting.
      #   - The ".env is needed" note is moot: this workflow sets the env vars
      #     directly in its own `env:` block.
      #
      # The blocker is one the old list did not name. This job runs under
      # DJANGO_SETTINGS_MODULE=...settings.test, where SECURE_SSL_REDIRECT is off
      # and DEBUG is on *by design* - so `check --deploy` reports W004/W008/W018
      # against settings that are behaving correctly. Measured: 18 issues, of which
      # the security ones are all artefacts of running a production check against
      # test settings (the rest are drf-spectacular enum-naming warnings, tracked
      # separately in docs/PROBLEMS.md).
      #
      # Making this meaningful means evaluating production-like settings, not
      # relaxing the check - which is a deployment decision, not a CI one.
      # ----------------------------------------------------------------------------
      #- name: Django deployment checks
      #  run: python src/urbanlens/manage.py check --deploy --fail-level WARNING

      - name: Django tests with coverage
        run: |
          coverage run --source=src src/urbanlens/manage.py test
          coverage xml
          coverage report --fail-under=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to the same exact patch as the Dockerfile (see its comment): bun
      # 1.4.0 dropped `bun build --format iife` and also changed enough
      # `preventDefault`/event-dispatch behavior under `bun test` to fail
      # autosave-guard.test.ts, which passes clean on 1.3.14.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: npm install

      # Both of these run in pre-commit, which only protects a developer who has
      # it installed and does not pass --no-verify. Without them here the whole
      # TypeScript suite - including the contract tests that guard agreements
      # between a template and the code reading it - never runs in CI, so a pull
      # request that breaks one merges green.
      - name: TypeScript typecheck
        run: bun run typecheck

      - name: TypeScript tests
        run: bun run test:ts

      - name: Build JavaScript bundle
        run: bun run build

      - name: Build stylesheet
        run: bun run sass

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [python-quality, frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: urbanlens/urbanlens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UL_DATABASE_USER=postgres
            UL_DATABASE_NAME=urbanlens_ci
            UL_DATABASE_PASS=postgres
            UL_DATABASE_HOST=urbanlens_db
            UL_DATABASE_PORT=5432
