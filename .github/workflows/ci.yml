name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: urbanlens.UrbanLens.settings.test
  DJANGO_SECRET_KEY: ci-insecure-secret-key
  UL_DB_NAME: urbanlens_ci
  UL_DB_USER: postgres
  UL_DB_PASS: postgres
  UL_DB_HOST: localhost
  UL_DB_PORT: "5432"
  UL_VALKEY_URL: redis://localhost:6379/0
  UL_UNSAFE_ALLOW_HTTP: "True"
  UL_ENVIRONMENT: testing

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: urbanlens_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urbanlens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev postgresql-client

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check src

      - name: Ruff format check
        run: ruff format --check src

      - name: Static type check
        run: mypy src --show-traceback
      - name: Imports resolve in the committed tree
        run: python3 bin/check_imports_tracked.py
      - name: Documentation citations point at real lines
        run: python3 bin/check_doc_line_refs.py
      - name: Migration graph resolves in the committed tree
        run: python3 bin/check_migration_graph.py
      - name: No swallowed-failure result gets cached as a success
        run: python3 bin/check_outage_not_cached.py

      - name: Every notification write honours the mute preference
        run: python3 bin/check_notification_choke_point.py
      - name: Versioned models intercept every write path
        run: python3 bin/check_versioned_writes.py
      - name: Signal subscriptions are reachable
        run: python3 bin/check_signal_reachable.py
      - name: A wiki resolved for reading is never saved
        run: python3 bin/check_concealed_writes.py
      - name: No template reads a photo's file without checking it is there
        run: python3 bin/check_image_file_reads.py
      - name: "Every /static/ URL a template writes goes through the static tag"
        run: python3 bin/check_static_url_literals.py
      - name: Template hash-comments close on the line they open
        run: python3 bin/check_template_comments.py
      - name: Tracked text files are stored with LF
        run: python3 bin/check_line_endings.py

      - name: A private pin's fields never reach a community wiki
        run: python3 bin/check_pin_not_published_to_wiki.py
      - name: Code cites only docs/ paths that exist
        run: python3 bin/check_docs_refs.py
      - name: docs/INDEX.md agrees with the entries it indexes
        run: python3 bin/check_docs_index.py
      - name: Every TypeScript file belongs to a tsconfig project
        run: python3 bin/check_typescript_coverage.py
      - name: Every var() names a custom property something defines
        run: python3 bin/check_css_variables.py
      - name: No missing migrations
        run: python src/urbanlens/manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          coverage run --source=src -m pytest
          coverage xml
          coverage report --fail-under=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck

      - name: TypeScript tests
        run: bun run test:ts

      - name: Build JavaScript bundle
        run: bun run build

      - name: Build stylesheet
        run: bun run sass
      - name: Every BEM modifier a template applies has a rule that styles it
        run: python3 bin/check_bem_modifiers.py

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Build the documentation
        run: uv run python bin/build_docs.py

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [python-quality, frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: urbanlens/urbanlens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UL_DATABASE_USER=postgres
            UL_DATABASE_NAME=urbanlens_ci
            UL_DATABASE_PASS=postgres
            UL_DATABASE_HOST=urbanlens_db
            UL_DATABASE_PORT=5432
