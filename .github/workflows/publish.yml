name: Publish Release Artifacts

on:
  release:
    types: [published]
  # Every push to main publishes :main and :sha-<7>, and the infrastructure repo
  # deploys it: UrbanLens/infrastructure's app-image.yml follows :main, pins the
  # matching :sha-<7>, and sends it through its CI-gated deploy branch to both
  # k3s sites. Nothing between this push and production is a human step.
  # UrbanLens/infrastructure docs/runbooks/app-deploys.md has the whole path.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or SHA to publish
        required: false
        default: main

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  build-python-package:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

      - name: Attach distributions to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  publish-container:
    name: Publish container image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ github.event_name == 'release' }}
            type=match,pattern=v(\d+\.\d+)\.\d+$,group=1,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            # :main only from a real push to main. It is what the infrastructure
            # repo deploys, so a workflow_dispatch of some other ref must never
            # move it; a dispatch still gets its :sha- tag.
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UL_DATABASE_USER=postgres
            UL_DATABASE_NAME=postgres
            UL_DATABASE_PASS=postgres
            UL_DATABASE_HOST=urbanlens_db
            UL_DATABASE_PORT=5432

      - name: Generate image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  notify-infrastructure:
    # A wake-up for UrbanLens/infrastructure's app-image.yml, so the deploy starts
    # within a minute instead of at that workflow's next 10-minute poll. OPTIONAL:
    # without INFRA_DISPATCH_TOKEN this step says so and succeeds, and the poll
    # still deploys the image. The payload is informational - the infrastructure
    # side re-reads :main from ghcr rather than trusting it, because two pushes a
    # minute apart can deliver their dispatches out of order.
    #
    # The token: a fine-grained PAT (or GitHub App token) scoped to the ONE
    # repository UrbanLens/infrastructure with "Contents: read and write" - the
    # permission GitHub requires for POST /repos/{owner}/{repo}/dispatches. That
    # is also enough to push there, so it is a real credential; the
    # infrastructure repo's runbook says what it costs and what it saves.
    name: Tell the infrastructure repo
    needs: publish-container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: repository_dispatch to UrbanLens/infrastructure
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.publish-container.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "INFRA_DISPATCH_TOKEN is not set - the infrastructure repo will pick this image up on its next poll (<= ~10 min)"
            exit 0
          fi
          gh api --method POST repos/UrbanLens/infrastructure/dispatches \
            -f event_type=urbanlens-image-published \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[tag]=sha-${SHA:0:7}" \
            -f "client_payload[digest]=${DIGEST}"
          echo "dispatched urbanlens-image-published for ${SHA}"
