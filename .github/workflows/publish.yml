name: Publish Release Artifacts

on:
  # Only a commit whose CI passed on main publishes. UrbanLens/infrastructure's
  # app-image.yml deploys whatever :main points at to both k3s sites, with no human
  # step between (../infrastructure/docs/runbooks/app-deploys.md), so :main must
  # never name untested code.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases release-please creates use GITHUB_TOKEN and start no workflow; their
  # version tags come from the CI run above. This is for a release a person publishes.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or SHA to publish (a release's tag also gets its version tags)
        required: false
        default: main

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    name: Decide what to publish
    # A fork's pull request can come from a branch named main, so the branch filter
    # alone does not make a CI run one of main's.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      short-sha: ${{ steps.plan.outputs.short-sha }}
      move-main: ${{ steps.plan.outputs.move-main }}
      release-tag: ${{ steps.plan.outputs.release-tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Resolve the commit, :main, and the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          # Only main's tip moves :main: a re-run of an older commit's CI must not
          # point it backwards. A dispatch never moves it.
          move_main=false
          if [ "$EVENT" = workflow_run ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$sha" ]; then
            move_main=true
          fi

          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(git ls-remote --tags origin 'refs/tags/v*' \
              | awk -v sha="$sha" '$1 == sha { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
              | sort -uV | tail -n 1)"
          fi
          prerelease=false
          if [ -n "$tag" ]; then
            if state="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"; then
              [ "${state% *}" = false ] || tag=""
              prerelease="${state#* }"
            else
              echo "tag ${tag} has no release - publishing without version tags"
              tag=""
            fi
          fi

          {
            echo "sha=${sha}"
            echo "short-sha=${sha:0:7}"
            echo "move-main=${move_main}"
            echo "release-tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "${sha}: move :main=${move_main}, release=${tag:-none}, prerelease=${prerelease}"

  build-python-package:
    name: Build Python distribution
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

      - name: Attach distributions to GitHub release
        if: needs.plan.outputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release-tag }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  publish-egress-proxy:
    # The AI tier's egress allowlist (src/urbanlens/config/egress) as an image of its own, for a
    # deployment that runs published images rather than building this checkout - the k3s sites
    # UrbanLens/infrastructure deploys. It carries the `filter` this commit's EgressFilterTests hold
    # to the hosts this commit's tools call, so it is tagged exactly like the app image and an
    # infrastructure pin of one tag names both. publish-container needs this job, so the app's
    # :sha-<7> and :main never name a commit whose proxy is missing.
    name: Publish egress-proxy image
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-egress-proxy
          flavor: |
            latest=false
          # The same tag rules as publish-container's, which explains each one. Keep the two in step:
          # infrastructure derives this image's tag from the app image's.
          tags: |
            type=match,pattern=v(.*),group=1,value=${{ needs.plan.outputs.release-tag }},enable=${{ needs.plan.outputs.release-tag != '' }}
            type=match,pattern=v(\d+\.\d+)\.\d+$,group=1,value=${{ needs.plan.outputs.release-tag }},enable=${{ needs.plan.outputs.release-tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.release-tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=main,enable=${{ needs.plan.outputs.move-main == 'true' }}
            type=raw,value=sha-${{ needs.plan.outputs.short-sha }},priority=100
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: src/urbanlens/config/egress
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope, so this build and the app's do not evict each other's layers.
          cache-from: type=gha,scope=egress-proxy
          cache-to: type=gha,mode=max,scope=egress-proxy

      - name: Generate image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-egress-proxy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-container:
    name: Publish container image
    needs: [plan, publish-egress-proxy]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # auto would add :latest to every type=match tag, prereleases included.
          flavor: |
            latest=false
          # The sha tag and the revision label the infrastructure repo reads come from the
          # plan, not the event: under workflow_run, github.sha is main's tip, not the commit built.
          tags: |
            type=match,pattern=v(.*),group=1,value=${{ needs.plan.outputs.release-tag }},enable=${{ needs.plan.outputs.release-tag != '' }}
            type=match,pattern=v(\d+\.\d+)\.\d+$,group=1,value=${{ needs.plan.outputs.release-tag }},enable=${{ needs.plan.outputs.release-tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.release-tag != '' && needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=main,enable=${{ needs.plan.outputs.move-main == 'true' }}
            type=raw,value=sha-${{ needs.plan.outputs.short-sha }},priority=100
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UL_DATABASE_USER=postgres
            UL_DATABASE_NAME=postgres
            UL_DATABASE_PASS=postgres
            UL_DATABASE_HOST=urbanlens_db
            UL_DATABASE_PORT=5432

      - name: Generate image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  notify-infrastructure:
    # A wake-up for UrbanLens/infrastructure's app-image.yml, whose own schedule runs
    # hours apart. OPTIONAL: without INFRA_DISPATCH_TOKEN this step says so and
    # succeeds. The payload is informational - the infrastructure side re-reads
    # :main from ghcr, because two dispatches can arrive out of order.
    #
    # The token: a fine-grained PAT (or GitHub App token) scoped to the ONE
    # repository UrbanLens/infrastructure with "Contents: read and write" - the
    # permission GitHub requires for POST /repos/{owner}/{repo}/dispatches. That
    # is also enough to push there, so it is a real credential.
    name: Tell the infrastructure repo
    needs: [plan, publish-container]
    if: needs.plan.outputs.move-main == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: repository_dispatch to UrbanLens/infrastructure
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
          DIGEST: ${{ needs.publish-container.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "INFRA_DISPATCH_TOKEN is not set - the infrastructure repo will pick this image up on its next scheduled run"
            exit 0
          fi
          gh api --method POST repos/UrbanLens/infrastructure/dispatches \
            -f event_type=urbanlens-image-published \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[tag]=sha-${SHA:0:7}" \
            -f "client_payload[digest]=${DIGEST}"
          echo "dispatched urbanlens-image-published for ${SHA}"
