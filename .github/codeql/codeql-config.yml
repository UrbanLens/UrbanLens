name: "UrbanLens CodeQL config"

# Directories only: the Python extractor crashes on Windows if a file is listed. `src` is too wide (Postgres data and
# tool caches live under it); bin/run_codeql.py adds every other tracked top-level `src/` directory when run locally.
paths:
  - src/urbanlens
  - bin
  - .github
  - tests

paths-ignore:
  - "**/frontend/static/**"
  - "**/migrations/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/.hypothesis/**"
  - "**/.mypy_cache/**"
  - "**/.pytest_cache/**"
  - "**/media/**"
  - "**/logs/**"
  - "**/reports/**"
  - "**/.venv/**"
  - "**/.venv_windows/**"
  - "**/.codeql/**"
  - "**/docs/**"
